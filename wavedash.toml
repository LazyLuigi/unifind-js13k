# Wavedash challenge configuration.
# game_id comes from the Developer Portal: `wavedash init` fills it in.
game_id = ""

# The Wavedash target is the unminified page, produced by `npm run build`.
# Do not point at the whole dist/: that would upload the contest build too.
upload_dir = "dist/wavedash"
entrypoint = "index.html"
