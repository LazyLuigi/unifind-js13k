<script>
/* Lab 3: le style autocollant, décliné, dans la grammaire du Zoo Licorne.
   Aucun trait de contour: des ellipses pleines, des accents arc-en-ciel,
   des yeux sombres avec une goutte de lumière, une corne en dégradé doré. */

function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; var t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }

var RB=['#ff7a9c','#ffb057','#ffe14d','#7fdc8a','#5fc8f5','#9b8cf5','#e08cf0'];
var ENCRE='#3b2a52', MUSEAU='#ffb3c8', JOUE='rgba(255,150,185,.45)';

/*  0 nom      1 bw  2 bh  3 hr  4 hw  5 nk  6 er 7 es  8 mz  9 mt 10 tl 11 hn 12 mn 13 lg 14 arm 15 eye 16 laine */
var SPECIES = [
  ['licorne', .150,.175,.165,1.06,.040, 2,.52,.62, 1, 2, 1, 1,.120, 0, 0, 0],
  ['cheval' , .152,.175,.165,1.06,.040, 2,.52,.62, 1, 2, 0, 1,.120, 0, 0, 0],
  ['ourson' , .205,.190,.185,1.04,.000, 1,.58,.50, 1, 1, 0, 0,.090, 0, 0, 0],
  ['hibou'  , .175,.200,.205,1.20,.000, 4,.58,.34, 3, 0, 0, 0,.070, 1, 2, 0],
  ['chat'   , .150,.170,.170,1.04,.020, 2,.62,.34, 1, 2, 0, 0,.110, 0, 0, 0],
  ['lapin'  , .145,.175,.160,0.96,.020, 3,1.20,.34,1, 1, 0, 0,.115, 0, 0, 0],
  ['renard' , .150,.170,.160,1.08,.030, 2,.88,.56, 1, 3, 0, 0,.110, 0, 0, 0],
  ['brebis' , .190,.180,.170,1.02,.000, 5,.55,.44, 1, 1, 0, 0,.085, 0, 0, 1],
  ['oiseau' , .130,.150,.150,1.00,.025, 0,.00,.50, 3, 0, 0, 1,.100, 1, 0, 0],
  ['grenoui', .200,.145,.185,1.32,.000, 0,.00,.00, 4, 0, 0, 0,.085, 0, 1, 0]
];

/* les quatre déclinaisons */
var LOOK = {
  classique: { bord:.052, bordCol:'#ffffff', voile:0,      volume:.06, ombre:.16, sat:66, lum:78 },
  holo:      { bord:.050, bordCol:'#ffffff', voile:.15,    volume:.14, ombre:.14, sat:66, lum:78 },
  moelleux:  { bord:.058, bordCol:'#ffffff', voile:0,      volume:.42, ombre:.20, sat:64, lum:79 },
  liseré:    { bord:.046, bordCol:'#ffffff', voile:0,      volume:.12, ombre:.15, sat:70, lum:75, bord2:.024 }
};

function hsl(h,s,l,a){ h=((h%360)+360)%360; return a==null?'hsl('+h+','+s+'%,'+l+'%)':'hsla('+h+','+s+'%,'+l+'%,'+a+')'; }

function makePalette(r, style, forceHue){
  var L=LOOK[style], h = forceHue!=null?forceHue:Math.floor(r()*360);
  var s=L.sat+Math.floor(r()*18), l=L.lum-Math.floor(r()*12);
  var ac = RB[Math.floor(r()*RB.length)];
  if(r()<.24) return {                       // famille crème, comme le lion du zoo
    hue:h, creme:1,
    corps:'#fff6ea', haut:'#fffdf7', bas:'#f3e4d6', ventre:'#fffaf2', patte:'#f0e0d2',
    accent:ac, museau:MUSEAU, encre:ENCRE, liseré:ac
  };
  return {
    hue:h,
    corps: hsl(h,s,l), haut: hsl(h,s-8,Math.min(96,l+8)), bas: hsl(h,s+12,l-13),
    ventre: hsl(h,s-16,Math.min(97,l+12)),
    patte: hsl(h,s+8,l-8),
    accent: ac, museau: MUSEAU, encre: ENCRE, liseré: hsl(h,72,62)
  };
}

function makeCreature(species, seed, style, forceHue){
  var r = mulberry32((seed*2654435761 + species*7919)>>>0), L=LOOK[style];
  var s = SPECIES[species], p={};
  var v=function(i,amt){ return s[i]*(1+(r()*2-1)*amt); };
  p.species=species; p.name=s[0]; p.style=style; p.L=L;
  p.bw=v(1,.11); p.bh=v(2,.09); p.hr=v(3,.10); p.hw=s[4]*(1+(r()*2-1)*.05);
  p.nk=s[5]; p.er=s[6]; p.es=v(7,.16); p.mz=v(8,.14); p.mt=s[9];
  p.tl=s[10]; p.hn=s[11]; p.mn=s[12]; p.lg=v(13,.12); p.arm=s[14]; p.eyeSt=s[15]; p.wool=s[16];
  p.fat=.92+r()*.20;
  p.pois = r()<.30;                       // quelques créatures à pois arc-en-ciel
  p.mouth = Math.floor(r()*3);
  p.rot = Math.floor(r()*7);              // départ de la crinière dans l'arc-en-ciel
  p.pal = makePalette(r, style, forceHue);
  p.m = metrics(p);
  return p;
}

function metrics(p){
  var m={}, footY=.5;
  m.bw=p.bw*p.fat; m.bh=p.bh;
  m.bodyCY=footY-p.lg-m.bh;
  m.headRX=p.hr*p.hw; m.headRY=p.hr;
  m.headCY=m.bodyCY-m.bh*.82-p.nk-m.headRY*.74;
  var top=m.headCY-m.headRY, e=p.hr*p.es, wid=Math.max(m.bw*1.9, m.headRX*2);
  if(p.mn) top=Math.min(top, m.headCY-m.headRY*1.26);
  if(p.wool){ top=Math.min(top, m.headCY-m.headRY*1.05); wid=Math.max(wid, m.bw*2.35); }
  if(p.er===1) top=Math.min(top, m.headCY-m.headRY*.70-e*.55);
  if(p.er===2) top=Math.min(top, m.headCY-m.headRY*.70-e*1.05);
  if(p.er===3) top=Math.min(top, m.headCY-m.headRY*.70-e*2.20);
  if(p.er===4) top=Math.min(top, m.headCY-m.headRY*.70-e*.95);
  if(p.hn)     top=Math.min(top, m.headCY-m.headRY*.92-p.hr*1.30);
  if(p.eyeSt===1) top=Math.min(top, m.headCY-m.headRY*.80-p.hr*.30);
  m.top=top-.02; m.bot=footY+.03; m.h=m.bot-m.top; m.w=wid*1.12;
  m.k=Math.min(.95/m.h,.95/m.w); m.dy=-(m.top+m.bot)/2*m.k;
  return m;
}

function ell(g,x,y,rx,ry,rot){ g.beginPath(); g.ellipse(x,y,Math.abs(rx),Math.abs(ry),rot||0,0,6.2832); }
function fill(g,c){ g.fillStyle=c; g.fill(); }
function capsule(g,x1,y1,x2,y2,w){ var dx=x2-x1,dy=y2-y1,L=Math.hypot(dx,dy);
  g.beginPath(); g.ellipse((x1+x2)/2,(y1+y2)/2,L/2+w/2,w/2,Math.atan2(dy,dx),0,6.2832); }

function drawCreature(g, p, style, pose){
  var P=p.pal, m=p.m;
  var bw=m.bw, bh=m.bh, bodyCY=m.bodyCY, headCY=m.headCY, hrx=m.headRX, hry=m.headRY;
  var up=pose===1, footR=Math.max(.028,p.lg*.46);

  g.save();
  g.scale(m.k,m.k); g.translate(0,m.dy/m.k);
  function vgrad(y0,y1,c0,c1){ var q=g.createLinearGradient(0,y0,0,y1); q.addColorStop(0,c0); q.addColorStop(1,c1); return q; }

  /* queue */
  var tx=-bw*.86, ty=bodyCY+bh*.24;
  if(p.tl===1){ ell(g,tx,ty,p.hr*.26,p.hr*.26); fill(g,P.ventre); }
  if(p.tl===2){ capsule(g,tx,ty,tx-p.hr*.46,ty-p.hr*(up?.85:.28),p.hr*.16); fill(g,P.accent); }
  if(p.tl===3){ ell(g,tx-p.hr*.26,ty-p.hr*.20,p.hr*.50,p.hr*.30,-.55); fill(g,P.accent);
    ell(g,tx-p.hr*.48,ty-p.hr*.32,p.hr*.24,p.hr*.18,-.55); fill(g,'#fffaf2'); }

  /* pattes */
  var sx=bw*.44, kick=up?.40:-.30;
  for(var s2=-1;s2<=1;s2+=2){ var fx=s2*sx+s2*p.lg*kick*.6;
    capsule(g,s2*sx,bodyCY+bh*.55,fx,.5-footR*.75,footR*1.00); fill(g,P.patte);
    ell(g,fx,.5-footR*.62,footR*1.12,footR*.80); fill(g,P.bas); }

  /* corps */
  ell(g,0,bodyCY,bw,bh); fill(g,vgrad(bodyCY-bh,bodyCY+bh,P.haut,P.bas));
  if(p.wool){ for(var q=0;q<8;q++){ var a=q/8*6.2832;
      ell(g,Math.cos(a)*bw*.80,bodyCY+Math.sin(a)*bh*.72,bw*.40,bw*.40); fill(g,'#fffdf8'); }
    ell(g,0,bodyCY,bw*.82,bh*.80); fill(g,'#fffdf8'); }
  else { ell(g,0,bodyCY+bh*.26,bw*.58,bh*.56); fill(g,P.ventre); }
  if(p.pois && !p.wool){ for(var d=0;d<4;d++){
      ell(g,(d%2?-1:1)*bw*(.30+.18*d),bodyCY-bh*.30+d*bh*.28,bw*.13,bw*.13); fill(g,RB[(p.rot+d)%7]); } }

  /* bras ou ailes */
  var ay=bodyCY-bh*.06;
  if(p.arm){ for(var i=-1;i<=1;i+=2){ ell(g,i*bw*.82,bodyCY,bw*.28,bh*(up?.52:.78),i*(up?-.85:-.12)); fill(g,P.ventre); } }
  else { var aeX=up?bw*.80:bw*.36, aeY=up?ay-bh*1.35:ay+bh*.95;
    for(var j0=-1;j0<=1;j0+=2){
      capsule(g,j0*bw*.68,ay,j0*(bw*.72+aeX),aeY,footR*.92); fill(g,P.patte);
      ell(g,j0*(bw*.72+aeX),aeY,footR*1.02,footR*1.02); fill(g,P.bas); } }

  if(p.nk>.001){ capsule(g,0,bodyCY-bh*.4,0,headCY+hry*.5,hrx*.52); fill(g,P.corps); }

  /* oreilles */
  var exx=hrx*.56, eyy=headCY-hry*.72, e=p.hr*p.es;
  function ears(){
    for(var i2=-1;i2<=1;i2+=2){
      if(p.er===1){ ell(g,i2*exx,eyy,e*.54,e*.54); fill(g,P.corps); ell(g,i2*exx,eyy+e*.06,e*.30,e*.30); fill(g,P.museau); }
      else if(p.er===2){ g.beginPath(); g.moveTo(i2*exx-e*.42,eyy+e*.34); g.quadraticCurveTo(i2*(exx+e*.10),eyy-e*1.02,i2*exx+e*.44,eyy+e*.26); g.closePath(); fill(g,P.corps);
        g.beginPath(); g.moveTo(i2*exx-e*.18,eyy+e*.22); g.quadraticCurveTo(i2*(exx+e*.06),eyy-e*.60,i2*exx+e*.20,eyy+e*.16); g.closePath(); fill(g,P.museau); }
      else if(p.er===3){ ell(g,i2*exx*.72,eyy-e*1.05,e*.28,e*1.20,i2*.14); fill(g,P.corps);
        ell(g,i2*exx*.72,eyy-e*1.05,e*.14,e*.90,i2*.14); fill(g,P.museau); }
      else if(p.er===4){ g.beginPath(); g.moveTo(i2*exx-e*.48,eyy+e*.26); g.lineTo(i2*(exx+e*.08),eyy-e*.92); g.lineTo(i2*exx+e*.46,eyy+e*.16); g.closePath(); fill(g,P.corps); }
      else if(p.er===5){ ell(g,i2*(exx+e*.16),eyy+e*.52,e*.38,e*.62,i2*.6); fill(g,P.bas); }
    }
  }
  if(p.er===3) ears();

  /* crinière arc-en-ciel, la signature du zoo */
  if(p.mn){ for(var k=0;k<7;k++){ var a2=-2.35+k*.44;
      ell(g,Math.cos(a2)*hrx*.86,headCY+Math.sin(a2)*hry*.92,hrx*.34,hrx*.34); fill(g,RB[(k+p.rot)%7]); } }

  /* tête */
  ell(g,0,headCY,hrx,hry); fill(g,vgrad(headCY-hry,headCY+hry,P.haut,P.corps));
  if(p.er!==3) ears();
  if(p.wool){ for(var w2=0;w2<5;w2++){ var a3=-2.6+w2*.65;
      ell(g,Math.cos(a3)*hrx*.72,headCY-hry*.10+Math.sin(a3)*hry*.62,hrx*.30,hrx*.30); fill(g,'#fffdf8'); } }

  /* museau, bec, bouche */
  var my;
  if(p.mt===1||p.mt===2){ ell(g,0,headCY+hry*.44,p.hr*p.mz*.62,p.hr*p.mz*.44); fill(g,P.museau); }
  if(p.mt===3){ var by=headCY+hry*.24,b=p.hr*p.mz;
    g.beginPath(); g.moveTo(-b*.38,by-b*.24); g.lineTo(b*.38,by-b*.24); g.lineTo(0,by+b*.82); g.closePath(); fill(g,'#ffb057'); }

  /* corne dorée */
  if(p.hn){ var hy=headCY-hry*.92, hh=p.hr*1.28;
    var gq=g.createLinearGradient(0,hy-hh,0,hy); gq.addColorStop(0,'#fff3c4'); gq.addColorStop(1,'#f6c34a');
    g.beginPath(); g.moveTo(-p.hr*.22,hy+p.hr*.14); g.quadraticCurveTo(-p.hr*.03,hy-hh*.5,0,hy-hh);
    g.quadraticCurveTo(p.hr*.05,hy-hh*.5,p.hr*.22,hy+p.hr*.14); g.closePath(); fill(g,gq);
    g.strokeStyle='rgba(214,158,44,.55)'; g.lineWidth=p.hr*.045;
    for(var sk=1;sk<4;sk++){ var u=sk/4;
      g.beginPath(); g.moveTo(-p.hr*.22*(1-u),hy+p.hr*.14-hh*u+p.hr*.04); g.lineTo(p.hr*.22*(1-u),hy+p.hr*.14-hh*u-p.hr*.02); g.stroke(); } }

  /* yeux */
  var er2=Math.min(p.hr*.30, hrx*.30), eo=Math.max(hrx*.38, er2*1.20), ey=headCY-hry*.04, j;
  if(p.eyeSt===1) ey=headCY-hry*.62;
  if(p.eyeSt===2){ for(j=-1;j<=1;j+=2){ ell(g,j*eo,ey,er2*1.30,er2*1.30); fill(g,'#fffdf8'); } }
  g.fillStyle=JOUE;
  ell(g,-eo-er2*.62,ey+er2*.92,er2*.60,er2*.36); g.fill();
  ell(g, eo+er2*.62,ey+er2*.92,er2*.60,er2*.36); g.fill();
  for(j=-1;j<=1;j+=2){
    ell(g,j*eo,ey,er2*.84,er2); fill(g,P.encre);
    g.fillStyle='#ffffff'; ell(g,j*eo-er2*.26,ey-er2*.34,er2*.32,er2*.34); g.fill();
    g.fillStyle='rgba(255,255,255,.65)'; ell(g,j*eo+er2*.28,ey+er2*.30,er2*.15,er2*.16); g.fill();
  }
  my=ey+er2*1.30;
  if(p.mt!==3){
    g.strokeStyle=P.encre; g.lineWidth=p.hr*.055; g.lineCap='round';
    if(p.mouth===0){ g.beginPath(); g.arc(0,my-p.hr*.04,p.hr*.13,.42,Math.PI-.42); g.stroke(); }
    else if(p.mouth===1){ g.beginPath(); g.arc(-p.hr*.07,my,p.hr*.075,0,Math.PI); g.arc(p.hr*.07,my,p.hr*.075,0,Math.PI); g.stroke(); }
    else { ell(g,0,my+p.hr*.03,p.hr*.075,p.hr*.065); fill(g,'#ff9ab6'); }
  }
  g.restore();
}

/* ---- rendu autocollant: voile irisé, volume, liseré, ombre portée ---- */
function renderSprite(mk, p, style, pose, S){
  var L=LOOK[style], base=mk(S,S), bg=base.getContext('2d');
  bg.save(); bg.translate(S/2,S/2); bg.scale(S,S); drawCreature(bg,p,style,pose); bg.restore();

  if(L.volume>0){                                   /* bombé: lumière en haut, ombre en bas */
    bg.globalCompositeOperation='source-atop';
    var gv=bg.createLinearGradient(0,S*.10,0,S*.92);
    gv.addColorStop(0,'rgba(255,255,255,'+L.volume+')');
    gv.addColorStop(.48,'rgba(255,255,255,0)');
    gv.addColorStop(1,'rgba(108,74,148,'+(L.volume*.62)+')');
    bg.fillStyle=gv; bg.fillRect(0,0,S,S);
    bg.globalCompositeOperation='source-over';
  }
  if(L.voile>0){                                    /* irisation */
    bg.globalCompositeOperation='source-atop';
    var gh=bg.createLinearGradient(S*.05,S*.95,S*.95,S*.05);
    for(var q=0;q<7;q++) gh.addColorStop(q/6, 'rgba('+[[255,140,190],[255,190,120],[255,240,130],[150,235,170],[130,215,250],[180,165,255],[235,150,240]][q].join(',')+','+L.voile+')');
    bg.fillStyle=gh; bg.fillRect(0,0,S,S);
    var gs=bg.createLinearGradient(0,S*.9,S,0);
    gs.addColorStop(.30,'rgba(255,255,255,0)'); gs.addColorStop(.44,'rgba(255,255,255,.42)'); gs.addColorStop(.56,'rgba(255,255,255,0)');
    bg.fillStyle=gs; bg.fillRect(0,0,S,S);
    bg.globalCompositeOperation='source-over';
  }

  var sil=mk(S,S), sg=sil.getContext('2d');         /* silhouette pour les liserés */
  sg.drawImage(base,0,0); sg.globalCompositeOperation='source-in';
  sg.fillStyle='#fff'; sg.fillRect(0,0,S,S);

  var out=mk(S,S), og=out.getContext('2d'), i, a;
  if(L.bord2){                                       /* liseré coloré sous le blanc */
    og.save(); og.globalAlpha=1;
    var col=mk(S,S), cg=col.getContext('2d');
    cg.drawImage(base,0,0); cg.globalCompositeOperation='source-in';
    cg.fillStyle=p.pal.liseré; cg.fillRect(0,0,S,S);
    var R2=S*(L.bord+L.bord2);
    for(i=0;i<20;i++){ a=i/20*6.2832; og.drawImage(col,Math.cos(a)*R2,Math.sin(a)*R2); }
    og.restore();
  }
  var R=S*L.bord;
  for(i=0;i<20;i++){ a=i/20*6.2832; og.drawImage(sil,Math.cos(a)*R,Math.sin(a)*R); }
  og.drawImage(sil,0,0);
  og.drawImage(base,0,0);
  return out;
}

/* ombre portée du sticker, générée une fois par gabarit */
function renderShadow(mk, sprite, S, alpha){
  var c=mk(S,S), g=c.getContext('2d');
  g.drawImage(sprite,0,0); g.globalCompositeOperation='source-in';
  g.fillStyle='rgba(84,56,120,'+alpha+')'; g.fillRect(0,0,S,S);
  return c;
}


var CREA={SPECIES:SPECIES,LOOK:LOOK,makeCreature:makeCreature,renderSprite:renderSprite,renderShadow:renderShadow,mulberry32:mulberry32};
/* Lab 3: une seule prairie, quatre ambiances, quatre traitements d'autocollant. */

var WW = 2600, WH = 1460, BPM = 124;
var RB3 = ['#ff7a9c','#ffb057','#ffe14d','#7fdc8a','#5fc8f5','#9b8cf5','#e08cf0'];

var AMB = {
  classique: { ciel:['#ffe9f5','#eef4ff','#dff0e4'], herbe1:'#a5e4a4', herbe2:'#b4ecb0', arc:.60, brin:'#7bc47f', deco:'jour' },
  holo:      { ciel:['#f6e8ff','#e9edff','#e2f2ec'], herbe1:'#a8e0b6', herbe2:'#bceec5', arc:.75, brin:'#7cc490', deco:'etincelles' },
  moelleux:  { ciel:['#fff1e6','#fdeaf4','#eaf6e6'], herbe1:'#aee5a8', herbe2:'#c2f0b8', arc:.45, brin:'#83c986', deco:'pois' },
  liseré:    { ciel:['#fdf6e8','#f0f6ff','#e6f4e8'], herbe1:'#a9e5a6', herbe2:'#bbedb4', arc:.55, brin:'#7ec583', deco:'carnet' }
};

function makeWorld(C, mk, style, count, seed){
  var r = C.mulberry32(seed>>>0);
  var w = { style:style, tpl:[], inst:[], deco:[], W:WW, H:WH };
  var NT = 44, S = 96;

  function pousse(sp, sd, hue){
    var p = C.makeCreature(sp, sd, style, hue);
    var a = C.renderSprite(mk,p,style,0,S), b = C.renderSprite(mk,p,style,1,S);
    w.tpl.push({ p:p, a:a, b:b, sa:C.renderShadow(mk,a,S,C.LOOK[style].ombre) });
  }
  for(var i=0;i<NT;i++) pousse(2 + Math.floor(r()*(C.SPECIES.length-2)), 1000+i*17, Math.floor(r()*360));
  for(var d=0; d<6; d++) pousse(1, 5000+d*29, Math.floor(r()*360));   /* chevaux, les leurres */
  pousse(0, 777, Math.floor(r()*360));                                 /* la licorne */
  var uniTpl = w.tpl.length-1;

  var rows = 15, y0 = 470, y1 = WH-80, slots = [];
  for(var ry=0; ry<rows; ry++){
    var f = ry/(rows-1);
    var y = y0 + (y1-y0)*Math.pow(f,1.12);
    var sc = 0.42 + 0.72*f;
    var per = Math.max(4, Math.round(count/rows * (0.7+0.6*f)));
    for(var k=0;k<per;k++)
      slots.push({ x: 50 + (WW-100)*((k + (ry%2)*0.5 + r()*0.75)/per), y: y + (r()*20-10), s: sc*(0.92+r()*0.16), row:ry });
  }
  var pick = slots.filter(function(s){ return s.row>3 && s.row<rows-3; });
  var uSlot = pick[Math.floor(r()*pick.length)];
  slots.forEach(function(s){
    w.inst.push({ x:s.x, y:s.y, s:s.s, t:(s===uSlot)?uniTpl:Math.floor(r()*(w.tpl.length-1)),
      off:Math.floor(r()*4)/4 + (r()<.25?.5:0), flip:r()<.5?-1:1, uni:(s===uSlot), tw:(r()*2-1)*.075 });
  });
  w.inst.sort(function(a,b){ return a.y-b.y; });
  w.uniIdx = w.inst.findIndex(function(o){ return o.uni; });

  for(var q=0;q<26;q++){                       /* arbres, buissons, mares du fond */
    var t2 = r(); 
    w.deco.push({ k: t2<.34?'arbre':t2<.72?'buisson':'mare', x: 40+r()*(WW-80), y: 430+r()*180, s:.7+r()*.5, ph:r()*6.28 });
  }
  for(var q2=0;q2<14;q2++)                     /* buissons du premier plan */
    w.deco.push({ k:'buisson', x: r()*WW, y: WH-40+r()*40, s:1.5+r()*.7, ph:r()*6.28, front:1 });
  w.fleurs = [];
  for(var f2=0; f2<150; f2++) w.fleurs.push({ x:r()*WW, y:500+r()*(WH-500), r:5+r()*6, c:RB3[Math.floor(r()*7)] });
  w.S = S;
  return w;
}

/* ---- pièces de décor, dans le trait du Zoo ---- */
function ell3(g,x,y,rx,ry,c){ g.fillStyle=c; g.beginPath(); g.ellipse(x,y,rx,ry,0,0,6.2832); g.fill(); }
function ombre3(g,x,y,rx){ ell3(g,x,y,rx,rx*.36,'rgba(84,56,120,.13)'); }

function dArbre(g,x,y,s,ph,t){
  ombre3(g,x,y+34*s,30*s);
  g.fillStyle='#b07a53'; g.fillRect(x-7*s,y-4*s,14*s,40*s);
  ell3(g,x-19*s,y-10*s,24*s,21*s,'#79cf85');
  ell3(g,x+19*s,y-8*s,21*s,19*s,'#8fdd97');
  ell3(g,x,y-31*s,28*s,26*s,'#a2e7a6');
  ell3(g,x-5*s,y-36*s,14*s,12*s,'#c2f2c0');
  for(var i=0;i<5;i++){ var a=i*1.3+ph+t*.2;
    ell3(g,x+Math.cos(a)*26*s,y-19*s+Math.sin(a)*19*s,4*s,4*s,RB3[i]); }
}
function dBuisson(g,x,y,s,ph,t){
  ombre3(g,x+0,y+18*s,22*s);
  ell3(g,x-14*s,y,16*s,14*s,'#7ccc88');
  ell3(g,x+13*s,y+2*s,14*s,13*s,'#8ed897');
  ell3(g,x,y-10*s,19*s,16*s,'#9fe3a3');
  for(var i=0;i<4;i++) ell3(g,x-16*s+i*10*s,y-8*s+Math.sin(i+ph+t)*4*s,3.4*s,3.4*s,RB3[(i+2)%7]);
}
function dMare(g,x,y,s,ph,t){
  var q=g.createRadialGradient(x,y,4,x,y,46*s);
  q.addColorStop(0,'#bff0ff'); q.addColorStop(1,'#6fc7ef');
  g.fillStyle=q; g.beginPath(); g.ellipse(x,y,46*s,30*s,0,0,6.2832); g.fill();
  g.strokeStyle='rgba(255,255,255,.7)'; g.lineWidth=2.5*s;
  for(var i=0;i<2;i++){ g.beginPath(); g.ellipse(x,y,(20+i*12)*s+Math.sin(t*1.6+i)*3,(12+i*7)*s,0,0,6.2832); g.stroke(); }
}

function drawRoom(g, style, t, w){
  var A = AMB[style], b = t*BPM/60, i;

  var ciel=g.createLinearGradient(0,0,0,WH);
  ciel.addColorStop(0,A.ciel[0]); ciel.addColorStop(.55,A.ciel[1]); ciel.addColorStop(1,A.ciel[2]);
  g.fillStyle=ciel; g.fillRect(0,0,WW,WH);

  for(i=0;i<7;i++){                                   /* nuages */
    var nx=(i*430+t*14)%(WW+300)-150, ny=70+((i*137)%190);
    ell3(g,nx,ny,110,52,'rgba(255,255,255,.72)');
    ell3(g,nx+78,ny+16,78,38,'rgba(255,255,255,.72)');
    ell3(g,nx-72,ny+20,64,32,'rgba(255,255,255,.72)');
  }

  g.save(); g.lineWidth=44; g.globalAlpha=A.arc;      /* l'arc sort des deux côtés */
  for(i=0;i<7;i++){ g.strokeStyle=RB3[i]; g.beginPath();
    g.arc(WW/2,3860,3660-i*44,Math.PI,Math.PI*2); g.stroke(); }
  g.restore();

  if(A.deco==='pois'){ for(i=0;i<60;i++){ var h=(i*2654435761)>>>0;
      ell3(g,h%WW,(h>>>9)%520,20+(h>>>4)%22,20+(h>>>4)%22,'rgba(255,255,255,.34)'); } }
  if(A.deco==='carnet'){ g.strokeStyle='rgba(150,180,210,.30)'; g.lineWidth=2;
    for(i=0;i<WW/64;i++){ g.beginPath(); g.moveTo(i*64,0); g.lineTo(i*64,WH); g.stroke(); }
    for(i=0;i<WH/64;i++){ g.beginPath(); g.moveTo(0,i*64); g.lineTo(WW,i*64); g.stroke(); } }

  /* collines */
  g.fillStyle=A.herbe1; g.beginPath(); g.moveTo(0,470);
  g.quadraticCurveTo(650,410,1300,468); g.quadraticCurveTo(1950,528,WW,452);
  g.lineTo(WW,WH); g.lineTo(0,WH); g.closePath(); g.fill();
  g.fillStyle=A.herbe2; g.beginPath(); g.moveTo(0,596);
  g.quadraticCurveTo(870,540,1620,600); g.quadraticCurveTo(2170,640,WW,586);
  g.lineTo(WW,WH); g.lineTo(0,WH); g.closePath(); g.fill();

  if(A.deco==='etincelles'){ for(i=0;i<70;i++){ var h2=(i*40503*2654435761)>>>0;
      var sx=h2%WW, sy=(h2>>>8)%WH, k=.5+.5*Math.sin(t*2.4+i);
      g.globalAlpha=.25+k*.6; ell3(g,sx,sy,3+k*4,3+k*4,RB3[i%7]); }
    g.globalAlpha=1; }

  for(i=0;i<w.fleurs.length;i++){ var f=w.fleurs[i]; ell3(g,f.x,f.y,f.r,f.r,f.c); }

  g.strokeStyle=A.brin; g.lineWidth=3; g.lineCap='round';   /* brins d'herbe */
  for(i=0;i<300;i++){ var h3=(i*2246822519)>>>0, gx=h3%WW, gy=490+((h3>>>7)%(WH-490)), hh=10+((h3>>>3)%18);
    var sw=Math.sin(t*1.3+i)*hh*.24;
    g.beginPath(); g.moveTo(gx,gy); g.quadraticCurveTo(gx+sw*.5,gy-hh*.6,gx+sw,gy-hh); g.stroke(); }

  for(i=0;i<w.deco.length;i++){ var d=w.deco[i]; if(d.front) continue;
    if(d.k==='arbre') dArbre(g,d.x,d.y,d.s,d.ph,t);
    else if(d.k==='buisson') dBuisson(g,d.x,d.y,d.s,d.ph,t);
    else dMare(g,d.x,d.y,d.s,d.ph,t); }
}

function drawFront(g, w, t){
  for(var i=0;i<w.deco.length;i++){ var d=w.deco[i]; if(d.front) dBuisson(g,d.x,d.y,d.s,d.ph,t); }
}

function drawCrowd(g, w, t, hint){
  var b=t*BPM/60, S=w.S;
  for(var i=0;i<w.inst.length;i++){
    var o=w.inst[i], ph=b+o.off;
    var bounce=Math.abs(Math.sin(Math.PI*ph));
    var pose=(Math.floor(ph)%2+2)%2;
    var tilt=Math.sin(Math.PI*ph)*.06 + o.tw;
    var sq=1+.06*Math.cos(Math.PI*2*ph);
    var tp=w.tpl[o.t], img=pose?tp.b:tp.a, sc=o.s*1.45;
    g.save();
    g.translate(o.x, o.y - bounce*S*sc*.09);
    g.rotate(tilt);
    g.scale(o.flip*sc, sc*sq);
    g.drawImage(tp.sa, -S/2+S*.05, -S*.86+S*.06, S, S);     /* ombre portée du sticker */
    if(hint && o.uni){ g.shadowColor='#fff'; g.shadowBlur=46; }
    g.drawImage(img, -S/2, -S*.86, S, S);
    g.restore();
  }
}

function drawWorld(g, w, t, hint){ drawRoom(g,w.style,t,w); drawCrowd(g,w,t,hint); drawFront(g,w,t); }


/* Application de démo: 4 styles, zoom, clic, tempo audio. */
var cv = document.getElementById('c'), X = cv.getContext('2d');
var buf = document.createElement('canvas'), BX = buf.getContext('2d');
var mk = function(w,h){ var c=document.createElement('canvas'); c.width=w; c.height=h; return c; };

var ST = { style:'classique', count:300, seed:12345, world:null, t0:performance.now(), hint:0, found:0, miss:0, best:null, bad:0 };
var view = { x:0, y:0, z:1, zf:1 };
var CW=0, CH=0, DPR=1;

function build(){
  ST.world = makeWorld(CREA, mk, ST.style, ST.count, ST.seed);
  ST.t0 = performance.now(); ST.found=0; ST.miss=0; ST.hint=0; ST.bad=0;
  if(AU.on) AU.origin = AU.ac.currentTime;
  fit();
}
function fit(){
  view.zf = Math.min(CW/WW, CH/WH);
  view.z = view.zf; view.x = (CW - WW*view.z)/2; view.y = (CH - WH*view.z)/2;
}
function resize(){
  DPR = Math.min(2, window.devicePixelRatio||1);
  CW = cv.clientWidth; CH = cv.clientHeight;
  cv.width = CW*DPR; cv.height = CH*DPR;
  var bw = Math.min(560, CW);
  buf.width = Math.round(bw); buf.height = Math.round(bw*CH/CW);
  if(!ST.world) build(); else fit();
}
window.addEventListener('resize', resize);

/* ---------- vue ---------- */
function clampView(){
  var zmin = view.zf*0.95, zmax = view.zf*7;
  view.z = Math.max(zmin, Math.min(zmax, view.z));
  var w = WW*view.z, h = WH*view.z;
  view.x = w<=CW ? (CW-w)/2 : Math.max(CW-w, Math.min(0, view.x));
  view.y = h<=CH ? (CH-h)/2 : Math.max(CH-h, Math.min(0, view.y));
}
function zoomAt(sx, sy, f){
  var wx = (sx-view.x)/view.z, wy = (sy-view.y)/view.z;
  view.z *= f; clampView();
  view.x = sx - wx*view.z; view.y = sy - wy*view.z; clampView();
}
cv.addEventListener('wheel', function(e){ e.preventDefault(); zoomAt(e.clientX, e.clientY, Math.exp(-e.deltaY*0.0016)); }, {passive:false});

var drag=null, pinch=null;
function pt(e){ return {x:e.clientX, y:e.clientY}; }
cv.addEventListener('pointerdown', function(e){ try{cv.setPointerCapture(e.pointerId);}catch(err){} drag={sx:e.clientX, sy:e.clientY, x:view.x, y:view.y, t:performance.now(), moved:0}; });
cv.addEventListener('pointermove', function(e){
  if(!drag) return;
  var dx=e.clientX-drag.sx, dy=e.clientY-drag.sy;
  drag.moved = Math.max(drag.moved, Math.abs(dx)+Math.abs(dy));
  view.x = drag.x+dx; view.y = drag.y+dy; clampView();
});
cv.addEventListener('pointerup', function(e){
  if(drag && drag.moved<8 && performance.now()-drag.t<450) tap(e.clientX, e.clientY);
  drag=null;
});
cv.addEventListener('pointercancel', function(){ drag=null; });

/* pincement */
var touches={};
cv.addEventListener('touchstart', function(e){ if(e.touches.length===2){ drag=null; pinch=dist(e.touches); } }, {passive:true});
cv.addEventListener('touchmove', function(e){
  if(e.touches.length===2){
    e.preventDefault();
    var d=dist(e.touches), mx=(e.touches[0].clientX+e.touches[1].clientX)/2, my=(e.touches[0].clientY+e.touches[1].clientY)/2;
    if(pinch) zoomAt(mx,my,d/pinch);
    pinch=d;
  }
}, {passive:false});
cv.addEventListener('touchend', function(e){ if(e.touches.length<2) pinch=null; }, {passive:true});
function dist(t){ var dx=t[0].clientX-t[1].clientX, dy=t[0].clientY-t[1].clientY; return Math.hypot(dx,dy); }

/* ---------- clic sur une créature ---------- */
function tap(sx, sy){
  if(ST.found) { next(); return; }
  var wx=(sx-view.x)/view.z, wy=(sy-view.y)/view.z, w=ST.world, S=w.S;
  for(var i=w.inst.length-1;i>=0;i--){
    var o=w.inst[i], sz=S*o.s*1.55;
    if(Math.abs(wx-o.x) < sz*0.30 && wy > o.y-sz*0.86 && wy < o.y+sz*0.12){
      if(o.uni){ ST.found = (performance.now()-ST.t0)/1000; if(!ST.best||ST.found<ST.best) ST.best=ST.found; boom(o); }
      else { ST.miss++; ST.bad=performance.now(); blip(160,.05); }
      return;
    }
  }
}
var pops=[];
function boom(o){
  for(var i=0;i<80;i++){ var a=Math.random()*6.2832, sp=120+Math.random()*420;
    pops.push({x:o.x, y:o.y-40, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp-160, h:Math.floor(Math.random()*360), l:1}); }
  blip(880,.12); setTimeout(function(){ blip(1320,.12); },110); setTimeout(function(){ blip(1760,.16); },220);
}

/* ---------- audio: kick, charley, basse ---------- */
var AU = { on:false, ac:null, origin:0, next:0, beat:0 };
function audioToggle(){
  if(!AU.ac){ AU.ac = new (window.AudioContext||window.webkitAudioContext)(); }
  AU.ac.resume();
  AU.on = !AU.on;
  if(AU.on){ AU.origin = AU.ac.currentTime - (performance.now()-ST.t0)/1000; AU.beat = Math.ceil((AU.ac.currentTime-AU.origin)*BPM/60); }
  document.getElementById('snd').textContent = AU.on ? 'son on' : 'son off';
}
function sched(){
  if(!AU.on) return;
  var spb = 60/BPM, ahead = AU.ac.currentTime + 0.2;
  while(AU.origin + AU.beat*spb < ahead){
    var t = AU.origin + AU.beat*spb, b = AU.beat;
    kick(t);
    hat(t+spb/2, .05);
    if(b%2===0) bass(t, [55,55,73.4,61.7][(b>>1)%4]);
    if(b%8===7) hat(t+spb*0.75,.07);
    AU.beat++;
  }
}
function kick(t){
  var o=AU.ac.createOscillator(), g=AU.ac.createGain();
  o.frequency.setValueAtTime(150,t); o.frequency.exponentialRampToValueAtTime(46,t+.12);
  g.gain.setValueAtTime(.5,t); g.gain.exponentialRampToValueAtTime(.001,t+.24);
  o.connect(g); g.connect(AU.ac.destination); o.start(t); o.stop(t+.26);
}
function hat(t,v){
  var b=AU.ac.createBuffer(1,1024,AU.ac.sampleRate), d=b.getChannelData(0);
  for(var i=0;i<1024;i++) d[i]=(Math.random()*2-1)*(1-i/1024);
  var s=AU.ac.createBufferSource(), g=AU.ac.createGain(), f=AU.ac.createBiquadFilter();
  f.type='highpass'; f.frequency.value=7000; s.buffer=b;
  g.gain.setValueAtTime(v,t); g.gain.exponentialRampToValueAtTime(.001,t+.05);
  s.connect(f); f.connect(g); g.connect(AU.ac.destination); s.start(t);
}
function bass(t,f){
  var o=AU.ac.createOscillator(), g=AU.ac.createGain();
  o.type='sawtooth'; o.frequency.value=f;
  var lp=AU.ac.createBiquadFilter(); lp.type='lowpass'; lp.frequency.setValueAtTime(900,t); lp.frequency.exponentialRampToValueAtTime(180,t+.3);
  g.gain.setValueAtTime(.16,t); g.gain.exponentialRampToValueAtTime(.001,t+.42);
  o.connect(lp); lp.connect(g); g.connect(AU.ac.destination); o.start(t); o.stop(t+.44);
}
function blip(f,v){
  if(!AU.ac) return;
  var t=AU.ac.currentTime, o=AU.ac.createOscillator(), g=AU.ac.createGain();
  o.type='square'; o.frequency.value=f;
  g.gain.setValueAtTime(v,t); g.gain.exponentialRampToValueAtTime(.001,t+.14);
  o.connect(g); g.connect(AU.ac.destination); o.start(t); o.stop(t+.16);
}

/* ---------- boucle ---------- */
var last=performance.now();
function frame(now){
  var dt=Math.min(.05,(now-last)/1000); last=now;
  var t=(now-ST.t0)/1000;
  sched();

  var g = (ST.style==='pixel') ? BX : X;
  var k = (ST.style==='pixel') ? buf.width/CW : DPR;
  g.setTransform(1,0,0,1,0,0);
  g.imageSmoothingEnabled = ST.style!=='pixel';
  g.clearRect(0,0,g.canvas.width,g.canvas.height);
  var shake = (performance.now()-ST.bad<220) ? Math.sin(performance.now()*.06)*5 : 0;
  g.setTransform(view.z*k,0,0,view.z*k, view.x*k+shake, view.y*k);
  drawWorld(g, ST.world, t, ST.hint>0);

  for(var i=pops.length-1;i>=0;i--){ var p=pops[i];
    p.x+=p.vx*dt; p.y+=p.vy*dt; p.vy+=900*dt; p.l-=dt*.7;
    if(p.l<=0){ pops.splice(i,1); continue; }
    g.fillStyle='hsla('+p.h+',90%,65%,'+p.l+')'; g.fillRect(p.x-6,p.y-6,12,12);
  }
  if(ST.hint>0) ST.hint-=dt;

  if(ST.style==='pixel'){
    X.setTransform(1,0,0,1,0,0); X.imageSmoothingEnabled=false;
    X.clearRect(0,0,cv.width,cv.height);
    X.drawImage(buf,0,0,cv.width,cv.height);
  }
  hud(t);
  requestAnimationFrame(frame);
}
function hud(t){
  var el=document.getElementById('timer');
  el.textContent = (ST.found? ST.found : t).toFixed(1)+' s';
  document.getElementById('miss').textContent = ST.miss+' erreur'+(ST.miss>1?'s':'');
  var w=document.getElementById('win');
  w.style.display = ST.found ? 'flex' : 'none';
  if(ST.found) document.getElementById('wt').textContent = 'trouvée en '+ST.found.toFixed(1)+' s';
}
function next(){ ST.seed = (ST.seed*1103515245+12345)>>>0; build(); }

/* ---------- UI ---------- */
document.querySelectorAll('[data-style]').forEach(function(b){
  b.onclick=function(){
    document.querySelectorAll('[data-style]').forEach(function(x){ x.classList.remove('on'); });
    b.classList.add('on'); ST.style=b.dataset.style; build();
    document.body.dataset.style = ST.style;
  };
});
document.querySelectorAll('[data-count]').forEach(function(b){
  b.onclick=function(){
    document.querySelectorAll('[data-count]').forEach(function(x){ x.classList.remove('on'); });
    b.classList.add('on'); ST.count=+b.dataset.count; build();
  };
});
document.getElementById('snd').onclick = audioToggle;
document.getElementById('hint').onclick = function(){ ST.hint=1.2; };
document.getElementById('next').onclick = next;
document.getElementById('wn').onclick = next;

resize();
requestAnimationFrame(frame);

</script></body></html>
