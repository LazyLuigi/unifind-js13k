<script>
/* Lab 3: le style autocollant, décliné, dans la grammaire du Zoo Licorne.
   Aucun trait de contour: des ellipses pleines, des accents arc-en-ciel,
   des yeux sombres avec une goutte de lumière, une corne en dégradé doré. */

function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; var t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }

var RB=['#ff7a9c','#ffb057','#ffe14d','#7fdc8a','#5fc8f5','#9b8cf5','#e08cf0'];
var ENCRE='#3b2a52', MUSEAU='#ffb3c8', JOUE='rgba(255,150,185,.45)';

/*  0 nom      1 bw  2 bh  3 hr  4 hw  5 nk  6 er 7 es  8 mz  9 mt 10 tl 11 hn 12 mn 13 lg 14 arm 15 eye 16 laine */
var SPECIES = [
  ['licorne', .150,.175,.165,1.06,.040, 2,.52,.62, 1, 2, 1, 1,.120, 0, 0, 0],
  ['cheval' , .152,.175,.165,1.06,.040, 2,.52,.62, 1, 2, 0, 1,.120, 0, 0, 0],
  ['ourson' , .205,.190,.185,1.04,.000, 1,.58,.50, 1, 1, 0, 0,.090, 0, 0, 0],
  ['hibou'  , .175,.200,.205,1.20,.000, 4,.58,.34, 3, 0, 0, 0,.070, 1, 2, 0],
  ['chat'   , .150,.170,.170,1.04,.020, 2,.62,.34, 1, 2, 0, 0,.110, 0, 0, 0],
  ['lapin'  , .145,.175,.160,0.96,.020, 3,1.20,.34,1, 1, 0, 0,.115, 0, 0, 0],
  ['renard' , .150,.170,.160,1.08,.030, 2,.88,.56, 1, 3, 0, 0,.110, 0, 0, 0],
  ['brebis' , .190,.180,.170,1.02,.000, 5,.55,.44, 1, 1, 0, 0,.085, 0, 0, 1],
  ['oiseau' , .130,.150,.150,1.00,.025, 0,.00,.50, 3, 0, 0, 1,.100, 1, 0, 0],
  ['grenoui', .200,.145,.185,1.32,.000, 0,.00,.00, 4, 0, 0, 0,.085, 0, 1, 0]
];

/* les quatre déclinaisons */
var LOOK = {
  club: { bord:.036, volume:.16, ombre:.24, sat:80, lum:62 }
};

function hsl(h,s,l,a){ h=((h%360)+360)%360; return a==null?'hsl('+h+','+s+'%,'+l+'%)':'hsla('+h+','+s+'%,'+l+'%,'+a+')'; }

function makePalette(r, style, forceHue){
  var L=LOOK[style], h = forceHue!=null?forceHue:Math.floor(r()*360);
  var s=L.sat+Math.floor(r()*18), l=L.lum-Math.floor(r()*12);
  var ac = RB[Math.floor(r()*RB.length)];
  if(r()<.10) return {                       // famille crème, comme le lion du zoo
    hue:h, creme:1,
    corps:'#fff6ea', haut:'#fffdf7', bas:'#f3e4d6', ventre:'#fffaf2', patte:'#f0e0d2',
    accent:ac, museau:MUSEAU, encre:ENCRE, liseré:ac
  };
  return {
    hue:h,
    corps: hsl(h,s,l), haut: hsl(h,s-8,Math.min(96,l+8)), bas: hsl(h,s+12,l-13),
    ventre: hsl(h,s-16,Math.min(97,l+12)),
    patte: hsl(h,s+8,l-8),
    accent: ac, museau: MUSEAU, encre: ENCRE, liseré: hsl(h,72,62)
  };
}

function makeCreature(species, seed, style, forceHue){
  var r = mulberry32((seed*2654435761 + species*7919)>>>0), L=LOOK[style];
  var s = SPECIES[species], p={};
  var v=function(i,amt){ return s[i]*(1+(r()*2-1)*amt); };
  p.species=species; p.name=s[0]; p.style=style; p.L=L;
  p.bw=v(1,.11); p.bh=v(2,.09); p.hr=v(3,.10); p.hw=s[4]*(1+(r()*2-1)*.05);
  p.nk=s[5]; p.er=s[6]; p.es=v(7,.16); p.mz=v(8,.14); p.mt=s[9];
  p.tl=s[10]; p.hn=s[11]; p.mn=s[12]; p.lg=v(13,.12); p.arm=s[14]; p.eyeSt=s[15]; p.wool=s[16];
  p.fat=.92+r()*.20;
  p.pois = r()<.30;                       // quelques créatures à pois arc-en-ciel
  p.mouth = Math.floor(r()*3);
  p.rot = Math.floor(r()*7);              // départ de la crinière dans l'arc-en-ciel
  p.pal = makePalette(r, style, forceHue);
  p.m = metrics(p);
  return p;
}

function metrics(p){
  var m={}, footY=.5;
  m.bw=p.bw*p.fat; m.bh=p.bh;
  m.bodyCY=footY-p.lg-m.bh;
  m.headRX=p.hr*p.hw; m.headRY=p.hr;
  m.headCY=m.bodyCY-m.bh*.82-p.nk-m.headRY*.74;
  var top=m.headCY-m.headRY, e=p.hr*p.es, wid=Math.max(m.bw*1.9, m.headRX*2);
  if(p.mn) top=Math.min(top, m.headCY-m.headRY*1.26);
  if(p.wool){ top=Math.min(top, m.headCY-m.headRY*1.05); wid=Math.max(wid, m.bw*2.35); }
  if(p.er===1) top=Math.min(top, m.headCY-m.headRY*.70-e*.55);
  if(p.er===2) top=Math.min(top, m.headCY-m.headRY*.70-e*1.05);
  if(p.er===3) top=Math.min(top, m.headCY-m.headRY*.70-e*2.20);
  if(p.er===4) top=Math.min(top, m.headCY-m.headRY*.70-e*.95);
  if(p.hn)     top=Math.min(top, m.headCY-m.headRY*.92-p.hr*1.30);
  if(p.eyeSt===1) top=Math.min(top, m.headCY-m.headRY*.80-p.hr*.30);
  m.top=top-.02; m.bot=footY+.03; m.h=m.bot-m.top; m.w=wid*1.12;
  m.k=Math.min(.95/m.h,.95/m.w); m.dy=-(m.top+m.bot)/2*m.k;
  return m;
}

function ell(g,x,y,rx,ry,rot){ g.beginPath(); g.ellipse(x,y,Math.abs(rx),Math.abs(ry),rot||0,0,6.2832); }
function fill(g,c){ g.fillStyle=c; g.fill(); }
function capsule(g,x1,y1,x2,y2,w){ var dx=x2-x1,dy=y2-y1,L=Math.hypot(dx,dy);
  g.beginPath(); g.ellipse((x1+x2)/2,(y1+y2)/2,L/2+w/2,w/2,Math.atan2(dy,dx),0,6.2832); }

function drawCreature(g, p, style, pose){
  var P=p.pal, m=p.m;
  var bw=m.bw, bh=m.bh, bodyCY=m.bodyCY, headCY=m.headCY, hrx=m.headRX, hry=m.headRY;
  var up=pose===1, footR=Math.max(.028,p.lg*.46);

  g.save();
  g.scale(m.k,m.k); g.translate(0,m.dy/m.k);
  function vgrad(y0,y1,c0,c1){ var q=g.createLinearGradient(0,y0,0,y1); q.addColorStop(0,c0); q.addColorStop(1,c1); return q; }

  /* queue */
  var tx=-bw*.86, ty=bodyCY+bh*.24;
  if(p.tl===1){ ell(g,tx,ty,p.hr*.26,p.hr*.26); fill(g,P.ventre); }
  if(p.tl===2){ capsule(g,tx,ty,tx-p.hr*.46,ty-p.hr*(up?.85:.28),p.hr*.16); fill(g,P.accent); }
  if(p.tl===3){ ell(g,tx-p.hr*.26,ty-p.hr*.20,p.hr*.50,p.hr*.30,-.55); fill(g,P.accent);
    ell(g,tx-p.hr*.48,ty-p.hr*.32,p.hr*.24,p.hr*.18,-.55); fill(g,'#fffaf2'); }

  /* pattes */
  var sx=bw*.44, kick=up?.40:-.30;
  for(var s2=-1;s2<=1;s2+=2){ var fx=s2*sx+s2*p.lg*kick*.6;
    capsule(g,s2*sx,bodyCY+bh*.55,fx,.5-footR*.75,footR*1.00); fill(g,P.patte);
    ell(g,fx,.5-footR*.62,footR*1.12,footR*.80); fill(g,P.bas); }

  /* corps */
  ell(g,0,bodyCY,bw,bh); fill(g,vgrad(bodyCY-bh,bodyCY+bh,P.haut,P.bas));
  if(p.wool){ for(var q=0;q<8;q++){ var a=q/8*6.2832;
      ell(g,Math.cos(a)*bw*.80,bodyCY+Math.sin(a)*bh*.72,bw*.40,bw*.40); fill(g,'#fffdf8'); }
    ell(g,0,bodyCY,bw*.82,bh*.80); fill(g,'#fffdf8'); }
  else { ell(g,0,bodyCY+bh*.26,bw*.58,bh*.56); fill(g,P.ventre); }
  if(p.pois && !p.wool){ for(var d=0;d<4;d++){
      ell(g,(d%2?-1:1)*bw*(.30+.18*d),bodyCY-bh*.30+d*bh*.28,bw*.13,bw*.13); fill(g,RB[(p.rot+d)%7]); } }

  /* bras ou ailes */
  var ay=bodyCY-bh*.06;
  if(p.arm){ for(var i=-1;i<=1;i+=2){ ell(g,i*bw*.82,bodyCY,bw*.28,bh*(up?.52:.78),i*(up?-.85:-.12)); fill(g,P.ventre); } }
  else { var aeX=up?bw*.80:bw*.36, aeY=up?ay-bh*1.35:ay+bh*.95;
    for(var j0=-1;j0<=1;j0+=2){
      capsule(g,j0*bw*.68,ay,j0*(bw*.72+aeX),aeY,footR*.92); fill(g,P.patte);
      ell(g,j0*(bw*.72+aeX),aeY,footR*1.02,footR*1.02); fill(g,P.bas); } }

  if(p.nk>.001){ capsule(g,0,bodyCY-bh*.4,0,headCY+hry*.5,hrx*.52); fill(g,P.corps); }

  /* oreilles */
  var exx=hrx*.56, eyy=headCY-hry*.72, e=p.hr*p.es;
  function ears(){
    for(var i2=-1;i2<=1;i2+=2){
      if(p.er===1){ ell(g,i2*exx,eyy,e*.54,e*.54); fill(g,P.corps); ell(g,i2*exx,eyy+e*.06,e*.30,e*.30); fill(g,P.museau); }
      else if(p.er===2){ g.beginPath(); g.moveTo(i2*exx-e*.42,eyy+e*.34); g.quadraticCurveTo(i2*(exx+e*.10),eyy-e*1.02,i2*exx+e*.44,eyy+e*.26); g.closePath(); fill(g,P.corps);
        g.beginPath(); g.moveTo(i2*exx-e*.18,eyy+e*.22); g.quadraticCurveTo(i2*(exx+e*.06),eyy-e*.60,i2*exx+e*.20,eyy+e*.16); g.closePath(); fill(g,P.museau); }
      else if(p.er===3){ ell(g,i2*exx*.72,eyy-e*1.05,e*.28,e*1.20,i2*.14); fill(g,P.corps);
        ell(g,i2*exx*.72,eyy-e*1.05,e*.14,e*.90,i2*.14); fill(g,P.museau); }
      else if(p.er===4){ g.beginPath(); g.moveTo(i2*exx-e*.48,eyy+e*.26); g.lineTo(i2*(exx+e*.08),eyy-e*.92); g.lineTo(i2*exx+e*.46,eyy+e*.16); g.closePath(); fill(g,P.corps); }
      else if(p.er===5){ ell(g,i2*(exx+e*.16),eyy+e*.52,e*.38,e*.62,i2*.6); fill(g,P.bas); }
    }
  }
  if(p.er===3) ears();

  /* crinière arc-en-ciel, la signature du zoo */
  if(p.mn){ for(var k=0;k<7;k++){ var a2=-2.35+k*.44;
      ell(g,Math.cos(a2)*hrx*.86,headCY+Math.sin(a2)*hry*.92,hrx*.34,hrx*.34); fill(g,RB[(k+p.rot)%7]); } }

  /* tête */
  ell(g,0,headCY,hrx,hry); fill(g,vgrad(headCY-hry,headCY+hry,P.haut,P.corps));
  if(p.er!==3) ears();
  if(p.wool){ for(var w2=0;w2<5;w2++){ var a3=-2.6+w2*.65;
      ell(g,Math.cos(a3)*hrx*.72,headCY-hry*.10+Math.sin(a3)*hry*.62,hrx*.30,hrx*.30); fill(g,'#fffdf8'); } }

  /* museau, bec, bouche */
  var my;
  if(p.mt===1||p.mt===2){ ell(g,0,headCY+hry*.44,p.hr*p.mz*.62,p.hr*p.mz*.44); fill(g,P.museau); }
  if(p.mt===3){ var by=headCY+hry*.24,b=p.hr*p.mz;
    g.beginPath(); g.moveTo(-b*.38,by-b*.24); g.lineTo(b*.38,by-b*.24); g.lineTo(0,by+b*.82); g.closePath(); fill(g,'#ffb057'); }

  /* corne dorée */
  if(p.hn){ var hy=headCY-hry*.92, hh=p.hr*1.28;
    var gq=g.createLinearGradient(0,hy-hh,0,hy); gq.addColorStop(0,'#fff3c4'); gq.addColorStop(1,'#f6c34a');
    g.beginPath(); g.moveTo(-p.hr*.22,hy+p.hr*.14); g.quadraticCurveTo(-p.hr*.03,hy-hh*.5,0,hy-hh);
    g.quadraticCurveTo(p.hr*.05,hy-hh*.5,p.hr*.22,hy+p.hr*.14); g.closePath(); fill(g,gq);
    g.strokeStyle='rgba(214,158,44,.55)'; g.lineWidth=p.hr*.045;
    for(var sk=1;sk<4;sk++){ var u=sk/4;
      g.beginPath(); g.moveTo(-p.hr*.22*(1-u),hy+p.hr*.14-hh*u+p.hr*.04); g.lineTo(p.hr*.22*(1-u),hy+p.hr*.14-hh*u-p.hr*.02); g.stroke(); } }

  /* yeux */
  var er2=Math.min(p.hr*.30, hrx*.30), eo=Math.max(hrx*.38, er2*1.20), ey=headCY-hry*.04, j;
  if(p.eyeSt===1) ey=headCY-hry*.62;
  if(p.eyeSt===2){ for(j=-1;j<=1;j+=2){ ell(g,j*eo,ey,er2*1.30,er2*1.30); fill(g,'#fffdf8'); } }
  g.fillStyle=JOUE;
  ell(g,-eo-er2*.62,ey+er2*.92,er2*.60,er2*.36); g.fill();
  ell(g, eo+er2*.62,ey+er2*.92,er2*.60,er2*.36); g.fill();
  for(j=-1;j<=1;j+=2){
    ell(g,j*eo,ey,er2*.84,er2); fill(g,P.encre);
    g.fillStyle='#ffffff'; ell(g,j*eo-er2*.26,ey-er2*.34,er2*.32,er2*.34); g.fill();
    g.fillStyle='rgba(255,255,255,.65)'; ell(g,j*eo+er2*.28,ey+er2*.30,er2*.15,er2*.16); g.fill();
  }
  my=ey+er2*1.30;
  if(p.mt!==3){
    g.strokeStyle=P.encre; g.lineWidth=p.hr*.055; g.lineCap='round';
    if(p.mouth===0){ g.beginPath(); g.arc(0,my-p.hr*.04,p.hr*.13,.42,Math.PI-.42); g.stroke(); }
    else if(p.mouth===1){ g.beginPath(); g.arc(-p.hr*.07,my,p.hr*.075,0,Math.PI); g.arc(p.hr*.07,my,p.hr*.075,0,Math.PI); g.stroke(); }
    else { ell(g,0,my+p.hr*.03,p.hr*.075,p.hr*.065); fill(g,'#ff9ab6'); }
  }
  g.restore();
}

/* ---- rendu autocollant: voile irisé, volume, liseré, ombre portée ---- */
function renderSprite(mk, p, style, pose, S){
  var L=LOOK[style], base=mk(S,S), bg=base.getContext('2d');
  bg.save(); bg.translate(S/2,S/2); bg.scale(S,S); drawCreature(bg,p,style,pose); bg.restore();

  if(L.volume>0){                                   /* bombé: lumière en haut, ombre en bas */
    bg.globalCompositeOperation='source-atop';
    var gv=bg.createLinearGradient(0,S*.10,0,S*.92);
    gv.addColorStop(0,'rgba(255,255,255,'+L.volume+')');
    gv.addColorStop(.48,'rgba(255,255,255,0)');
    gv.addColorStop(1,'rgba(108,74,148,'+(L.volume*.62)+')');
    bg.fillStyle=gv; bg.fillRect(0,0,S,S);
    bg.globalCompositeOperation='source-over';
  }

  var sil=mk(S,S), sg=sil.getContext('2d');         /* silhouette pour les liserés */
  sg.drawImage(base,0,0); sg.globalCompositeOperation='source-in';
  sg.fillStyle='#fff'; sg.fillRect(0,0,S,S);

  var out=mk(S,S), og=out.getContext('2d'), i, a;
  var R=S*L.bord;
  for(i=0;i<20;i++){ a=i/20*6.2832; og.drawImage(sil,Math.cos(a)*R,Math.sin(a)*R); }
  og.drawImage(sil,0,0);
  og.drawImage(base,0,0);
  return out;
}

/* ombre portée du sticker, générée une fois par gabarit */
function renderShadow(mk, sprite, S, alpha){
  var c=mk(S,S), g=c.getContext('2d');
  g.drawImage(sprite,0,0); g.globalCompositeOperation='source-in';
  g.fillStyle='rgba(84,56,120,'+alpha+')'; g.fillRect(0,0,S,S);
  return c;
}


/* Moteur musical procédural.
   Tout est synthétisé: aucun échantillon.
   Un morceau = des pistes (motifs de 16 pas) montées en sections
   (intro, montée, refrain, pont), avec fills et montées automatiques. */

var MIN = [0,2,3,5,7,8,10];        // mineur naturel
var DOR = [0,2,3,5,7,9,10];        // dorien, pour la deep house
var MAJ = [0,2,4,5,7,9,11];

function nHz(n){ return 440*Math.pow(2,(n-69)/12); }
function degre(sc, d){                                  // degré de gamme, octaves comprises
  var o = Math.floor(d/7), i = ((d%7)+7)%7;
  return sc[i] + o*12;
}
function accord(sc, d){ return [degre(sc,d), degre(sc,d+2), degre(sc,d+4)]; }

/* ---------------- les six morceaux ---------------- */
/*  p  = motif rythmique sur 16 pas: x fort, o faible, . silence
    m  = mélodie en degrés de gamme, null = silence
    b  = variante jouée pendant les refrains                      */
var GENRES = {
techno: { bpm:132, sc:MIN, root:45, swing:0,
  prog:[0,0,5,4],
  trk:{
    kick: {p:'x...x...x...x...'},
    clap: {p:'....x.......x...'},
    hat:  {p:'..x...x...x...x.'},
    ohat: {p:'....o.......o..o'},
    bass: {p:'..x...x.x.x...x.', oct:-1},
    stab: {p:'..x.....x...x...', oct:0},
    lead: {p:'x.x.x.x.x.x.x.x.', oct:2,
           m:[0,null,4,null,7,null,4,null,3,null,7,null,9,null,7,null],
           b:[7,null,9,11,null,9,7,null,4,null,7,null,11,null,9,null]},
    arp:  {p:'xxxxxxxxxxxxxxxx', oct:2, arp:[0,2,4,6,4,2]}
  },
  sec:[ {n:'intro',  b:4, t:'kick hat'},
        {n:'montée', b:4, t:'kick hat ohat bass'},
        {n:'refrain',b:8, t:'kick clap hat ohat bass stab lead', R:1},
        {n:'pont',   b:4, t:'hat bass arp'},
        {n:'refrain',b:8, t:'kick clap hat ohat bass stab lead arp', R:1},
        {n:'sortie', b:4, t:'kick hat ohat bass'} ] },

deep: { bpm:122, sc:DOR, root:43, swing:.14,
  prog:[0,3,5,4],
  trk:{
    kick: {p:'x...x...x...x...'},
    clap: {p:'....x.......x...'},
    hat:  {p:'..o...o...o...o.'},
    ohat: {p:'..x...x...x...x.'},
    bass: {p:'x.....x...x.....', oct:-1},
    pad:  {p:'x...............', oct:0, long:1},

/* ---------------- options de R&D ---------------- */
var FX={ ster:1, sc:1, rev:1, sat:1, solo:1 };
var PAN={ hat:.38, ohat:-.32, clap:.22, snare:-.12, arp:-.42, lead:.30, stab:.26, tom:-.36, solo:.46 };
var SEND={ clap:.34, snare:.30, lead:.34, arp:.26, pad:.42, stab:.32, solo:.40, tom:.25 };
var SOLO=null, SEED=1;

/* Solo procédural: le contour vient de la graine, l'harmonie est corrigée au vol.
   Structure A A B A, marche mélodique par petits intervalles, temps forts
   ramenés sur une note de l'accord courant: ça reste consonant quel que soit le morceau. */
function rnd32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; var t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function genSolo(seed){
  var r=rnd32(seed>>>0), i, deg=3+Math.floor(r()*4);
  var dens=[.38,.48,.60][Math.floor(r()*3)], A=[], B=[];
  for(i=0;i<16;i++){
    var fort=(i%4===0), p=fort?dens*1.6:(i%2===0?dens:dens*.62);
    if(i===0 || r()<p){
      var pas=[-4,-2,-1,-1,-1,1,1,1,2,4][Math.floor(r()*10)];
      deg=Math.max(0,Math.min(10,deg+pas));
      A[i]=deg;
    } else A[i]=null;
  }
  for(i=0;i<16;i++) B[i] = A[i]==null?null:Math.max(0,Math.min(9,A[i]+(r()<.5?2:-2)));
  SEED=seed; return [A,A,B,A];
}
function consonant(n, d){                      // ramène n sur la triade du degré d
  var c=[d,d+2,d+4,d+7,d+9,d+11], b=c[0], i;
  for(i=1;i<c.length;i++) if(Math.abs(c[i]-n)<Math.abs(b-n)) b=c[i];
  return b;
}

/* ---------------- moteur ---------------- */
function Moteur(){
  this.ac=null; this.g=null; this.genre='techno'; this.on=false;
  this.pas=0; this.next=0; this.mute={}; this.actifs={}; this.seed=1;
}
Moteur.prototype.init=function(){
  if(this.ac) return;

  this.ac=A;

  comp.threshold.value=-12; comp.ratio.value=6; comp.attack.value=.004; comp.release.value=.18;

  lp.type='lowpass'; lp.frequency.value=2600;
  fb.gain.value=.34; dg.gain.value=.30;

  this.fx=d; this.dly=d;

  this.satC=new Float32Array(1024); this.linC=new Float32Array(1024);
  for(var i=0;i<1024;i++){ var x=i/512-1; this.satC[i]=Math.tanh(x*2.2)/Math.tanh(2.2); this.linC[i]=x; }
  sat.curve=this.satC; sat.oversample='2x';

  var ir=A.createBuffer(2, A.sampleRate*1.6|0, A.sampleRate);   /* reverbe: impulsion generee */
  for(var ch=0;ch<2;ch++){ var dd=ir.getChannelData(ch);
    for(var j=0;j<dd.length;j++) dd[j]=(Math.random()*2-1)*Math.pow(1-j/dd.length,2.6); }
  var cv=A.createConvolver(); cv.buffer=ir;
  var rg=A.createGain(); rg.gain.value=.34;
  cv.connect(rg); rg.connect(m);

  var duck=A.createGain(); duck.gain.value=1; duck.connect(m);   /* sidechain */
  var perc=A.createGain(); perc.gain.value=1; perc.connect(m);
  this.duck=duck; this.perc=perc; this.bus={};
};

/* un bus par piste: panoramique, routage sidechain, envoi vers la reverbe */
Moteur.prototype.out=function(nom){
  var b=this.bus[nom];
  if(!b){
    var A=this.ac, p=A.createStereoPanner ? A.createStereoPanner() : A.createGain();
    if(p.pan) p.pan.value=0;
    var sec=(nom==='kick'||nom==='snare'||nom==='clap'||nom==='hat'||nom==='ohat'||nom==='tom');
    p.connect(sec?this.perc:this.duck);
    var sg=A.createGain(); sg.gain.value=0; p.connect(sg); sg.connect(this.rev);
    b=this.bus[nom]={ n:p, s:sg, pan:PAN[nom]||0, send:SEND[nom]||0 };
  }
  if(b.n.pan) b.n.pan.value = FX.ster ? b.pan : 0;
  b.s.gain.value = FX.rev ? b.send : 0;
  return b.n;
};
Moteur.prototype.dest=function(){ return this.dst||this.g; };
Moteur.prototype.spb=function(){ return 60/GENRES[this.genre].bpm/4; };   // durée d'un pas

/* --- voix --- */
Moteur.prototype.env=function(node,t,v,a,d){
  var g=this.ac.createGain();
  g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(v,t+a);

Moteur.prototype.bruit=function(t,dur,hz,q,v,type,dest){

  var f=A.createBiquadFilter(); f.type=type||'bandpass'; f.frequency.value=hz; f.Q.value=q;

    var o=A.createOscillator(); o.type='sawtooth'; o.frequency.value=nHz(notes[i]);
    var o2=A.createOscillator(); o2.type='sawtooth'; o2.frequency.value=nHz(notes[i])*1.007;
    o.connect(f); o2.connect(f); o.start(t); o2.start(t); o.stop(t+dur+.05); o2.stop(t+dur+.05);
  }
};
Moteur.prototype.accordCourt=function(t,notes,dur,v){
  for(var i=0;i<notes.length;i++) this.pluck(t,notes[i],dur,v/notes.length*1.4,'sawtooth',1);
};
Moteur.prototype.montee=function(t,dur){          // balayage de bruit avant un refrain
  var A=this.ac, n=A.sampleRate*dur|0, b=A.createBuffer(1,n,A.sampleRate), c=b.getChannelData(0), i;
  for(i=0;i<n;i++) c[i]=(Math.random()*2-1);
  var s=A.createBufferSource(); s.buffer=b;
  var f=A.createBiquadFilter(); f.type='bandpass'; f.Q.value=3;
  f.frequency.setValueAtTime(400,t); f.frequency.exponentialRampToValueAtTime(7000,t+dur);
  var g=A.createGain(); g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(.16,t+dur);
  g.gain.exponentialRampToValueAtTime(.0001,t+dur+.12);
  s.connect(f); f.connect(g); g.connect(this.dest()); s.start(t); s.stop(t+dur+.14);
};
Moteur.prototype.impact=function(t){
  var A=this.ac,o=A.createOscillator(),g=A.createGain();
  o.type='sine'; o.frequency.setValueAtTime(90,t); o.frequency.exponentialRampToValueAtTime(30,t+.7);
  g.gain.setValueAtTime(.5,t); g.gain.exponentialRampToValueAtTime(.0001,t+.8);
  o.connect(g); g.connect(this.dest()); o.start(t); o.stop(t+.82);
  this.bruit(t,.7,900,.5,.22,'lowpass',this.fx);
};

/* --- effets sonores du jeu --- */
Moteur.prototype.sfx=function(k){
  if(!this.ac) return;
  var t=this.ac.currentTime, i, self=this;
  this.dst=this.g;
  if(k==='ok'){ [0,4,7,12].forEach(function(n,i){ self.dst=self.g; self.pluck(t+i*.055, 76+n, .30, .20, 'triangle', 1); }); }
  else if(k==='no'){
    var o=this.ac.createOscillator(), g=this.ac.createGain();
    o.type='square'; o.frequency.setValueAtTime(220,t); o.frequency.exponentialRampToValueAtTime(70,t+.20);
    g.gain.setValueAtTime(.18,t); g.gain.exponentialRampToValueAtTime(.0001,t+.24);
    o.connect(g); g.connect(this.g); o.start(t); o.stop(t+.26);
  }
  else { for(i=0;i<5;i++) this.pluck(t+i*.04, 72+[0,7,12,16,19][i], .55, .14, 'triangle', 1); }
};

/* --- arrangement --- */
function planSections(G){
  var p=[], m=0;
  for(var i=0;i<G.sec.length;i++){ p.push({i:i,deb:m,fin:m+G.sec[i].b}); m+=G.sec[i].b; }
  return {p:p, total:m};
}
Moteur.prototype.sectionA=function(bar){
  var G=GENRES[this.genre], pl=this.plan||(this.plan=planSections(G));
  var b=bar%pl.total;
  for(var i=0;i<pl.p.length;i++) if(b>=pl.p[i].deb && b<pl.p[i].fin)
    return {s:G.sec[pl.p[i].i], idx:pl.p[i].i, dans:b-pl.p[i].deb, len:G.sec[pl.p[i].i].b, bar:b};
  return {s:G.sec[0], idx:0, dans:0, len:G.sec[0].b, bar:b};
};
Moteur.prototype.pasAudible=function(){
  if(!this.ac||!this.on) return 0;
  return Math.max(0, this.pas - (this.next-this.ac.currentTime)/this.spb());
};
Moteur.prototype.etat=function(){                       // ce que l'oreille entend maintenant
  var pa=this.pasAudible(), bar=Math.floor(pa/16), e=this.sectionA(bar);
  return { section:e.s.n, refrain:!!e.s.R, dans:e.dans, len:e.len,
           pas:Math.floor(pa)%16, frac:pa%1, bar:bar, idx:e.idx, pistes:e.s.t.split(' ') };
};

Moteur.prototype.jouePas=function(i, t){
  var G=GENRES[this.genre], sc=G.sc, root=G.root;
  var bar=Math.floor(i/16), step=i%16;
  var e=this.sectionA(bar), act=e.s.t.split(' '), R=!!e.s.R;
  var deg=G.prog[bar%G.prog.length];
  var ch=accord(sc,deg);
  var derniere = e.dans===e.len-1;
  this.actifs={}; for(var k=0;k<act.length;k++) this.actifs[act[k]]=1;

  function a(n){ return act.indexOf(n)>=0; }
  var mute=this.mute;

  for(var ti=0; ti<act.length; ti++){
    var nom=act[ti], T=G.trk[nom]; if(!T||mute[nom]) continue;
    var c=T.p.charAt(step); if(c==='.') continue;
    var v=(c==='x')?1:.6;
    this.dst=this.out(nom);

    if(nom==='kick'){ this.kick(t,.85*v); this.pompe(t); }
    else if(nom==='snare'){ this.snare(t,.5*v); }
    else if(nom==='clap'){ this.clap(t,.42*v); }
    else if(nom==='hat'){ this.hat(t,.20*v,0); }
    else if(nom==='ohat'){ this.hat(t,.16*v,1); }
    else if(nom==='tom'){ this.tom(t,.4*v); }
    else if(nom==='bass'){
      var n0=root+degre(sc,deg)+(T.oct||0)*12;
      this.basse(t,n0,this.spb()*1.6,.30*v, R?1500:900);
    }
    else if(nom==='sub'){ this.sub(t,root+degre(sc,deg)+(T.oct||0)*12,this.spb()*6,.42*v); }
    else if(nom==='wob'){
      var mm=(R?T.b:T.m)[step]; if(mm===null||mm===undefined) continue;
      this.wobble(t, root+degre(sc,deg+mm)+(T.oct||0)*12, this.spb()*3.4, .34*v,
                  [2,3,4,6][(bar+step)%4]);
    }
    else if(nom==='reese'){
      var mr=(R?T.b:T.m)[step]; if(mr===null||mr===undefined) continue;
      this.reese(t, root+degre(sc,deg+mr)+(T.oct||0)*12, this.spb()*7, .26*v);
    }
    else if(nom==='pad'){ this.nappe(t, ch.map(function(x){ return root+x+(T.oct||0)*12+12; }), this.spb()*16*(T.long?1:.5), .13*v); }
    else if(nom==='stab'){ this.accordCourt(t, ch.map(function(x){ return root+x+12; }), .22, .26*v); }
    else if(nom==='lead'){
      var ml=(R&&T.b?T.b:T.m)[step]; if(ml===null||ml===undefined) continue;
      this.pluck(t, root+degre(sc,deg+ml)+(T.oct||0)*12, this.spb()*3, .22*v, 'square', 1);
    }
    else if(nom==='arp'){
      var seq=T.arp, idx=(step+bar*3)%seq.length;
      this.pluck(t, root+degre(sc,deg+seq[idx])+(T.oct||0)*12, this.spb()*1.6, .13*v, 'sawtooth', 1);
    }
  }

  /* solo procédural: refrains et pont, uniquement dans les trous du lead */
  if(FX.solo && SOLO && (R || e.s.n==='pont')){
    var sn=SOLO[bar%4][step], LT=G.trk.lead;
    if(sn!=null && !(LT && LT.p.charAt(step)!=='.')){
      if(step%4===0) sn=consonant(sn, deg);
      this.dst=this.out('solo');
      this.pluck(t, root+degre(sc,sn)+24, this.spb()*2.4, .17, 'triangle', 1);
    }
  }

  /* fill de fin de section: roulement sur le dernier temps */
  if(derniere && step>=12 && (a('snare')||a('clap'))){
    this.bruit(t,.06,1600,.8,.30,'highpass');
    if(step===15) this.bruit(t,.05,1600,.8,.34,'highpass');
  }
  /* montée sur la dernière mesure avant un refrain, impact sur le premier temps */
  var suiv=this.sectionA(bar+1);
  if(derniere && step===0 && suiv.s.R) this.montee(t, this.spb()*16);
  if(e.dans===0 && step===0 && e.s.R) this.impact(t);
};

Moteur.prototype.tick=function(){
  if(!this.on) return;
  if(this.sat) this.sat.curve = FX.sat ? this.satC : this.linC;
  if(this.revG) this.revG.gain.value = FX.rev ? .34 : 0;
  if(!FX.sc && this.duck) this.duck.gain.cancelScheduledValues(this.ac.currentTime), this.duck.gain.value=1;
  var A=this.ac, ahead=A.currentTime+.15, sp=this.spb(), G=GENRES[this.genre];
  while(this.next<ahead){
    var sw = (G.swing && (this.pas%2)) ? sp*G.swing : 0;
    try{ this.jouePas(this.pas, this.next+sw); }catch(e){}
    this.next+=sp; this.pas++;
  }
};
Moteur.prototype.start=function(){
  this.init(); if(this.ac.state==='suspended') this.ac.resume();
  this.on=true; this.pas=0; this.plan=null; this.next=this.ac.currentTime+.08;
  if(!this.timer) this.timer=setInterval(this.tick.bind(this),25);
};
Moteur.prototype.stop=function(){ this.on=false; };
Moteur.prototype.saut=function(idx){
  var G=GENRES[this.genre], pl=this.plan||(this.plan=planSections(G));
  this.pas=pl.p[idx].deb*16;
  if(this.ac) this.next=this.ac.currentTime+.05;
};
Moteur.prototype.setGenre=function(g){
  this.genre=g; this.plan=null; this.pas=0;
  if(this.ac) this.next=this.ac.currentTime+.05;
};
/* position musicale en temps, pour synchroniser une animation */
Moteur.prototype.phase=function(){ return this.pasAudible()/4; };   // en noires


/* Lab musique: on écoute, on édite les motifs, on saute de section en section,
   et une rangée de danseurs prouve que l'animation suit le tempo. */

var cv=document.getElementById('c'), X=cv.getContext('2d');
var mk=function(w,h){ var c=document.createElement('canvas'); c.width=w; c.height=h; return c; };
var M=new Moteur(), W=0, H=0, DPR=1;
var GS=Object.keys(GENRES);
var COUL={techno:'#9b8cf5',deep:'#5fc8f5',dubstep:'#7fdc8a',dnb:'#ff7a9c',synthwave:'#e08cf0',
          trance:'#ffb057',melodic:'#ffe14d',psy:'#7fdc8a',garage:'#5fc8f5'};
var SALLE={techno:'Warehouse',deep:'Lounge',dubstep:'Subwoofer',dnb:'Bunker',synthwave:'Neon',
           trance:'Beach',melodic:'Meadow',psy:'Forest',garage:'Rooftop'};
var ORIG={};                                   // copie des motifs, pour la remise à zéro
GS.forEach(function(g){ ORIG[g]={}; var T=GENRES[g].trk;
  Object.keys(T).forEach(function(k){ ORIG[g][k]=T[k].p; }); });

/* danseurs, style autocollant classique */
var DANS=[], SD=96;
(function(){
  var r=mulberry32(4242);
  for(var i=0;i<9;i++){
    var sp = i===4 ? 0 : 2+Math.floor(r()*(SPECIES.length-2));
    var p=makeCreature(sp, 300+i*37, 'club', Math.floor(r()*360));
    DANS.push({ a:renderSprite(mk,p,'club',0,SD), b:renderSprite(mk,p,'club',1,SD),
                off:(i%4)/4 + (i%3===0?.5:0), flip:i%2?1:-1, uni:i===4 });
  }
})();

function resize(){
  DPR=Math.min(2,window.devicePixelRatio||1);
  W=cv.clientWidth; H=cv.clientHeight;
  cv.width=W*DPR; cv.height=H*DPR;
}
window.addEventListener('resize',resize);

/* ---- géométrie de l'interface ---- */
function zones(){
  var G=GENRES[M.genre], pistes=Object.keys(G.trk);
  var padX=14, top=14;
  var strH=40, strY=top;
  var gx=Math.min(104, W*.26), gy=strY+strH+22;
  var lh=Math.min(34, Math.max(22, (H-gy-190)/pistes.length));
  var gw=W-gx-padX, cw=gw/16;
  return { G:G, pistes:pistes, padX:padX, strY:strY, strH:strH, gx:gx, gy:gy, lh:lh, gw:gw, cw:cw,
           danY:gy+pistes.length*lh+30 };
}

/* ---- dessin ---- */
function fond(){
  var q=X.createLinearGradient(0,0,0,H);
  q.addColorStop(0,'#ffeef8'); q.addColorStop(.5,'#eef2ff'); q.addColorStop(1,'#e6f5ea');
  X.fillStyle=q; X.fillRect(0,0,W,H);
}
function rr(x,y,w,h,r){ X.beginPath(); X.roundRect(x,y,w,h,r); }
function txt(s,x,y,size,col,al,gras){
  X.font=(gras?'bold ':'')+size+'px "Trebuchet MS",system-ui,sans-serif';
  X.textAlign=al||'left'; X.fillStyle=col; X.fillText(s,x,y);
}

function dessineStructure(Z,e){
  var G=Z.G, total=0, i;
  for(i=0;i<G.sec.length;i++) total+=G.sec[i].b;
  var x=Z.padX, y=Z.strY, w=W-Z.padX*2;
  for(i=0;i<G.sec.length;i++){
    var s=G.sec[i], sw=w*s.b/total, cour=(e&&e.idx===i);
    X.fillStyle = s.R ? (cour?'#ff7a9c':'rgba(255,122,156,.34)') : (cour?'#9b8cf5':'rgba(155,140,245,.24)');
    rr(x+2,y,sw-4,Z.strH,10); X.fill();
    txt(s.n, x+sw/2, y+Z.strH/2+5, Math.min(13,sw/6), cour?'#fff':'#6a4f86','center',cour);
    if(cour && e){                                        /* progression dans la section */
      X.fillStyle='rgba(255,255,255,.45)';
      rr(x+2,y+Z.strH-6,(sw-4)*((e.dans+e.frac/16+ (e.pas/16))/e.len),4,2); X.fill();
    }
    x+=sw;
  }
}

function dessineGrille(Z,e){
  var G=Z.G, i, j;
  for(i=0;i<Z.pistes.length;i++){
    var nom=Z.pistes[i], T=G.trk[nom], y=Z.gy+i*Z.lh;
    var actif = e ? e.pistes.indexOf(nom)>=0 : true;
    var coupe = !!M.mute[nom];

    X.fillStyle = coupe ? 'rgba(190,175,205,.35)' : (actif?'rgba(255,255,255,.72)':'rgba(255,255,255,.34)');
    rr(Z.padX,y+2,Z.gx-Z.padX-6,Z.lh-4,8); X.fill();
    txt(nom, Z.padX+8, y+Z.lh/2+4, Math.min(13,Z.lh*.46), coupe?'#b3a2c4':'#6a4f86',null,actif);

    for(j=0;j<16;j++){
      var c=T.p.charAt(j), x=Z.gx+j*Z.cw;
      var on=c!=='.', fort=c==='x';
      var col = j%4===0 ? 'rgba(255,255,255,.55)' : 'rgba(255,255,255,.32)';
      X.fillStyle=col; rr(x+1.5,y+2,Z.cw-3,Z.lh-4,6); X.fill();
      if(on){
        X.fillStyle = coupe ? '#c9bcd8' : (actif ? (fort?COUL[M.genre]:'rgba(155,140,245,.55)') : 'rgba(150,130,180,.30)');
        rr(x+2.5,y+3,Z.cw-5,Z.lh-6,5); X.fill();
      }
    }
  }
  if(e){                                                  /* tête de lecture */
    var hx=Z.gx+e.pas*Z.cw;
    X.strokeStyle='rgba(255,122,156,.9)'; X.lineWidth=2.5;
    rr(hx+1,Z.gy,Z.cw-2,Z.pistes.length*Z.lh,7); X.stroke();
  }
}

function dessineDanseurs(Z,ph,e){
  var y=Math.max(Z.danY, H-118), n=DANS.length;
  var pas=Math.min(W/(n+1), 120), x0=W/2-(n-1)*pas/2;
  for(var i=0;i<n;i++){
    var d=DANS[i], p=ph+d.off;
    var bounce=Math.abs(Math.sin(Math.PI*p));
    var pose=(Math.floor(p)%2+2)%2;
    var sc=pas/SD*1.15;
    X.save();
    X.translate(x0+i*pas, y - bounce*22);
    X.rotate(Math.sin(Math.PI*p)*.07);
    X.scale(d.flip*sc, sc*(1+.06*Math.cos(Math.PI*2*p)));
    X.drawImage(pose?d.b:d.a, -SD/2, -SD*.86, SD, SD);
    X.restore();
  }
  var iy=Math.min(y-104, Z.gy+Z.pistes.length*Z.lh+54);    /* bloc d'info, dans le vide */
  var k=Math.max(0,1-(ph%1)*2.4);
  for(var q=0;q<4;q++){                                    /* quatre temps de la mesure */
    var on=Math.floor(ph)%4===q, kk=on?k:0;
    X.fillStyle= on ? 'rgba(255,122,156,'+(.35+kk*.55)+')' : 'rgba(155,140,245,.20)';
    X.beginPath(); X.arc(W/2-42+q*28, iy, 7+kk*6, 0, 6.2832); X.fill();
  }
  if(e){ txt(e.refrain?'refrain':e.section, W/2, iy-24, 16, e.refrain?'#ff7a9c':'#6a4f86','center',1);
    txt('mesure '+(e.dans+1)+' sur '+e.len+'   |   '+GENRES[M.genre].bpm+' bpm   |   '+
        SALLE[M.genre]+'   |   morceau de '+(32*4*60/GENRES[M.genre].bpm).toFixed(0)+' s',
        W/2, iy+28, 11,'rgba(106,79,134,.7)','center'); }
  else txt('appuie sur écouter', W/2, iy-24, 15,'rgba(106,79,134,.75)','center',1);
  txt('une case pour l\u2019activer   |   un nom pour couper la piste   |   une section pour y sauter',
      W/2, Z.gy+Z.pistes.length*Z.lh+22, 11, 'rgba(106,79,134,.55)','center');
}

function frame(){
  resizeSiBesoin();
  X.setTransform(DPR,0,0,DPR,0,0);
  fond();
  var Z=zones(), e=M.on?M.etat():null, ph=M.phase();
  dessineStructure(Z,e);
  dessineGrille(Z,e);
  dessineDanseurs(Z,ph,e);
  requestAnimationFrame(frame);
}
var lastW=0,lastH=0;
function resizeSiBesoin(){ if(cv.clientWidth!==lastW||cv.clientHeight!==lastH){ lastW=cv.clientWidth; lastH=cv.clientHeight; resize(); } }

/* ---- interactions sur le canevas ---- */
cv.addEventListener('pointerdown', function(ev){
  var b=cv.getBoundingClientRect(), x=ev.clientX-b.left, y=ev.clientY-b.top, Z=zones(), G=Z.G, i;
  if(y>=Z.strY && y<=Z.strY+Z.strH){                      /* saut de section */
    var total=0; for(i=0;i<G.sec.length;i++) total+=G.sec[i].b;
    var ax=Z.padX, w=W-Z.padX*2;
    for(i=0;i<G.sec.length;i++){ var sw=w*G.sec[i].b/total;
      if(x>=ax && x<ax+sw){ M.saut(i); return; } ax+=sw; }
    return;
  }
  if(y>=Z.gy && y<Z.gy+Z.pistes.length*Z.lh){
    var li=Math.floor((y-Z.gy)/Z.lh), nom=Z.pistes[li], T=G.trk[nom];
    if(x<Z.gx){ M.mute[nom]=!M.mute[nom]; return; }       /* couper la piste */
    var col=Math.floor((x-Z.gx)/Z.cw);                    /* éditer le motif */
    if(col<0||col>15) return;
    var c=T.p.charAt(col), nc = c==='.'?'x' : c==='x'?'o' : '.';
    T.p = T.p.substring(0,col)+nc+T.p.substring(col+1);
  }
});

/* ---- boutons ---- */
function maj(){
  document.querySelectorAll('[data-g]').forEach(function(b){
    b.classList.toggle('on', b.dataset.g===M.genre); });
  document.getElementById('play').textContent = M.on ? 'pause' : 'écouter';
}
document.querySelectorAll('[data-g]').forEach(function(b){
  b.onclick=function(){ M.setGenre(b.dataset.g); if(!M.on){ M.start(); } maj(); };
});
document.getElementById('play').onclick=function(){
  if(M.on){ M.stop(); } else { M.start(); } maj();
};
document.getElementById('raz').onclick=function(){
  var T=GENRES[M.genre].trk;
  Object.keys(T).forEach(function(k){ T[k].p=ORIG[M.genre][k]; });
  M.mute={};
};
document.getElementById('solob').onclick=function(){
  var e=M.on?M.etat():null; if(!e) return;
  var tout=Object.keys(GENRES[M.genre].trk), rien=true;
  tout.forEach(function(k){ if(M.mute[k]) rien=false; });
  if(!rien){ M.mute={}; return; }
  tout.forEach(function(k){ if(k!=='kick'&&k!=='bass'&&k!=='sub') M.mute[k]=1; });
};

document.querySelectorAll('[data-fx]').forEach(function(b){
  b.onclick=function(){ FX[b.dataset.fx]=FX[b.dataset.fx]?0:1; b.classList.toggle('on', !!FX[b.dataset.fx]); };
});
document.getElementById('seed').onclick=function(){ genSolo((Math.random()*1e9)|0); };
document.getElementById('tout').onclick=function(){
  var t=(FX.ster||FX.sc||FX.rev||FX.sat||FX.solo)?0:1;
  ['ster','sc','rev','sat','solo'].forEach(function(k){ FX[k]=t; });
  document.querySelectorAll('[data-fx]').forEach(function(b){ b.classList.toggle('on', !!t); });
  document.getElementById('tout').textContent = t?'tout couper':'tout activer';
};
document.getElementById('sfxok').onclick=function(){ M.init(); M.sfx('ok'); };
document.getElementById('sfxno').onclick=function(){ M.init(); M.sfx('no'); };
genSolo((Math.random()*1e9)|0);
resize(); maj();
requestAnimationFrame(frame);

</script></body></html>
