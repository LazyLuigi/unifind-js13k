<script>
/* Lab 2: quatre directions mignonnes.
   Nouveauté: le style change aussi les PROPORTIONS, pas seulement les couleurs. */

function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; var t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }

/*  0 nom      1 bw  2 bh  3 hr  4 hw  5 nk  6 er 7 es  8 mz  9 mt 10 tl 11 hn 12 mn 13 lg 14 arm 15 eye */
var SPECIES = [
  ['licorne', .160,.190,.160,1.12,.045, 2,.50,.80, 2, 2, 1, 1,.140, 0, 0],
  ['cheval' , .162,.190,.160,1.12,.045, 2,.50,.80, 2, 2, 0, 1,.140, 0, 0],
  ['ourson' , .225,.205,.175,1.05,.000, 1,.60,.45, 1, 1, 0, 0,.105, 0, 0],
  ['hibou'  , .190,.215,.215,1.25,.000, 4,.60,.30, 3, 0, 0, 0,.080, 1, 2],
  ['chat'   , .155,.180,.155,1.05,.025, 2,.65,.28, 1, 2, 0, 0,.130, 0, 0],
  ['lapin'  , .150,.185,.145,0.95,.025, 3,1.35,.30,1, 1, 0, 0,.135, 0, 0],
  ['renard' , .160,.175,.145,1.10,.035, 2,.95,.80, 2, 3, 0, 0,.130, 0, 0],
  ['cochon' , .240,.195,.170,1.15,.000, 5,.65,.50, 1, 1, 0, 0,.095, 0, 0],
  ['oiseau' , .130,.155,.135,1.00,.030, 0,.00,.55, 3, 0, 0, 1,.115, 1, 0],
  ['grenoui', .225,.150,.185,1.40,.000, 0,.00,.00, 4, 0, 0, 0,.095, 0, 1]
];

/* morphologie + traitement par style */
var LOOK = {
  chibi:   { head:1.90, body:.86, leg:.60, ear:.82, eye:2.50, muz:.55, nose:1, cheek:.85, mouth:1, gloss:.42, out:'tint', ow:.027, sat:72, lum:69, halo:0 },
  pastel:  { head:1.42, body:1.00, leg:.82, ear:.95, eye:1.85, muz:.75, nose:1, cheek:.70, mouth:1, gloss:.22, out:'tint', ow:.026, sat:64, lum:73, halo:0 },
  flash:   { head:1.34, halo2:1, body:1.05, leg:.95, ear:1.0, eye:1.60, muz:.85, nose:1, cheek:.35, mouth:1, gloss:.55, out:'dark', ow:.038, sat:88, lum:60, halo:.022 },
  sticker: { head:1.58, body:.96, leg:.70, ear:.90, eye:2.15, muz:.60, nose:1, cheek:.80, mouth:1, gloss:.34, out:'white',ow:.028, sat:78, lum:64, halo:.062 }
};

function hsl(h,s,l,a){ h=((h%360)+360)%360; return a==null? 'hsl('+h+','+s+'%,'+l+'%)' : 'hsla('+h+','+s+'%,'+l+'%,'+a+')'; }

function makePalette(r, style, forceHue){
  var L=LOOK[style], h = forceHue!=null ? forceHue : Math.floor(r()*360);
  var h2 = h + (r()<.5?-48:48) + Math.floor(r()*36);
  var s=L.sat, l=L.lum;
  return {
    hue:h,
    body: hsl(h,s,l), bodyTop: hsl(h,s-6,Math.min(94,l+11)), bodyBot: hsl(h,s+8,l-13),
    belly: hsl(h,s-12,Math.min(96,l+13)),
    line: L.out==='dark' ? '#20162c' : hsl(h,Math.max(34,s-10),Math.max(22,l-48)),
    accent: hsl(h2,s+6,Math.min(88,l+4)),
    accentBot: hsl(h2,s+12,l-12),
    eye: style==='flash' ? '#20172c' : hsl(h,34,20),
    cheek: hsl(h+335,88,72,.55),
    gloss:'rgba(255,255,255,',
    halo: L.out==='white' ? '#ffffff' : '#241a30'
  };
}

function makeCreature(species, seed, style, forceHue){
  var r = mulberry32((seed*2654435761 + species*7919)>>>0), L=LOOK[style];
  var s = SPECIES[species], p = {};
  var v = function(i,amt){ return s[i]*(1+(r()*2-1)*amt); };
  p.species=species; p.name=s[0]; p.style=style; p.L=L;
  p.bw=v(1,.12)*L.body; p.bh=v(2,.10)*L.body; p.hr=v(3,.11)*L.head; p.hw=s[4]*(1+(r()*2-1)*.06);
  p.nk=s[5]*L.leg; p.er=s[6]; p.es=v(7,.18)*(L.ear||1); p.mz=v(8,.16)*L.muz; p.mt=s[9];
  p.tl=s[10]; p.hn=s[11]; p.mn=s[12]; p.lg=v(13,.14)*L.leg; p.arm=s[14]; p.eyeSt=s[15];
  p.fat=.90+r()*.24;
  p.blush = r()<.75;
  p.mouth = Math.floor(r()*3);            // 0 arc, 1 petit w, 2 ovale ouvert
  p.pal = makePalette(r, style, forceHue);
  p.m = metrics(p);
  return p;
}

function metrics(p){
  var m={}, footY=.5, L=p.L;
  m.bw=p.bw*p.fat; m.bh=p.bh;
  m.bodyCY = footY - p.lg - m.bh;
  m.headRX = p.hr*p.hw; m.headRY = p.hr;
  m.headCY = m.bodyCY - m.bh*.88 - p.nk - m.headRY*.80;
  var top = m.headCY - m.headRY, e = p.hr*p.es, wid = Math.max(m.bw, m.headRX);
  if(p.er===1){ top=Math.min(top, m.headCY-m.headRY*.70-e*.55); wid=Math.max(wid, m.headRX*.58+e*.55); }
  if(p.er===2){ top=Math.min(top, m.headCY-m.headRY*.70-e*1.05); wid=Math.max(wid, m.headRX*.58+e*.44); }
  if(p.er===3){ top=Math.min(top, m.headCY-m.headRY*.70-e*2.30); wid=Math.max(wid, m.headRX*.45+e*.30); }
  if(p.er===4){ top=Math.min(top, m.headCY-m.headRY*.70-e*.95); wid=Math.max(wid, m.headRX*.58+e*.50); }
  if(p.er===5){ wid=Math.max(wid, m.headRX*.58+e*.58); }
  if(p.hn)     top=Math.min(top, m.headCY-m.headRY*.88-p.hr*1.58);
  if(p.eyeSt===1) top=Math.min(top, m.headCY-m.headRY*.78-p.hr*.34);
  wid=Math.max(wid, m.bw*1.85);
  m.top=top-.02; m.bot=footY+.03; m.h=m.bot-m.top; m.w=wid*2.20;
  m.k = Math.min(.95/m.h, .95/m.w);
  m.dy = -(m.top+m.bot)/2*m.k;
  return m;
}

function ell(g,x,y,rx,ry,rot){ g.beginPath(); g.ellipse(x,y,Math.abs(rx),Math.abs(ry),rot||0,0,6.2832); }
function seg(g,x1,y1,x2,y2,w,col){ g.beginPath(); g.lineWidth=w; g.lineCap='round'; g.moveTo(x1,y1); g.lineTo(x2,y2); g.strokeStyle=col; g.stroke(); }
function capsule(g,x1,y1,x2,y2,w){ var dx=x2-x1, dy=y2-y1, L=Math.hypot(dx,dy);
  g.beginPath(); g.ellipse((x1+x2)/2,(y1+y2)/2,L/2+w/2,w/2,Math.atan2(dy,dx),0,6.2832); }

function drawCreature(g, p, style, pose){
  var P=p.pal, m=p.m, L=p.L, thick=L.ow;
  var bw=m.bw, bh=m.bh, bodyCY=m.bodyCY, headCY=m.headCY, hrx=m.headRX, hry=m.headRY;
  var up = pose===1;

  g.save();
  g.scale(m.k,m.k); g.translate(0, m.dy/m.k);
  g.lineJoin='round'; g.lineCap='round';

  function vgrad(y0,y1,c0,c1){ var gr=g.createLinearGradient(0,y0,0,y1); gr.addColorStop(0,c0); gr.addColorStop(1,c1); return gr; }
  function fs(fill){ g.fillStyle=fill; g.fill(); if(thick>0){ g.strokeStyle=P.line; g.lineWidth=thick; g.stroke(); } }

  /* queue */
  var tx=-bw*.90, ty=bodyCY+bh*.2;
  if(p.tl===1){ ell(g,tx,ty,p.hr*.30,p.hr*.30); fs(P.accent); }
  if(p.tl===2){ seg(g,tx,ty,tx-p.hr*.55,ty-p.hr*(up?.95:.30),thick*2.6,P.accentBot); }
  if(p.tl===3){ ell(g,tx-p.hr*.30,ty-p.hr*.22,p.hr*.58,p.hr*.34,-.55); fs(P.accent); }

  /* jambes courtes et rondes */
  var sx=bw*.46, kick=up?.45:-.35, footR=Math.max(.022, p.lg*.34);
  for(var s2=-1;s2<=1;s2+=2){
    var fx=s2*sx+s2*p.lg*kick*.5;
    capsule(g,s2*sx,bodyCY+bh*.60,fx,.5-footR*.7,footR*1.05); fs(P.body);
    ell(g,fx,.5-footR*.55,footR*1.20,footR*.88); fs(P.accentBot);
  }

  /* corps */
  ell(g,0,bodyCY,bw,bh); fs(vgrad(bodyCY-bh,bodyCY+bh,P.bodyTop,P.bodyBot));
  ell(g,0,bodyCY+bh*.26,bw*.56,bh*.58); g.fillStyle=P.belly; g.fill();

  /* bras ou ailes */
  var ay=bodyCY-bh*.02;
  if(p.arm){
    for(var i=-1;i<=1;i+=2){ ell(g,i*bw*.84,bodyCY+bh*.02,bw*.30,bh*(up?.55:.82),i*(up?-.9:-.15)); fs(P.belly); }
  } else {
    var aeX=up?bw*.95:bw*.42, aeY=up?ay-bh*1.55:ay+bh*1.05;
    for(var j0=-1;j0<=1;j0+=2){
      capsule(g,j0*bw*.72,ay,j0*(bw*.80+aeX),aeY,footR*.95); fs(P.body);
      ell(g,j0*(bw*.80+aeX),aeY,footR*1.05,footR*1.05); fs(P.accentBot);
    }
  }

  if(p.nk>.001) seg(g,0,bodyCY-bh*.5,0,headCY+hry*.5,thick*5,P.body);

  /* oreilles */
  var exx=hrx*.56, eyy=headCY-hry*.72, e=p.hr*p.es;
  function ears(){
    for(var i2=-1;i2<=1;i2+=2){
      if(p.er===1){ ell(g,i2*exx,eyy,e*.55,e*.55); fs(P.accent); ell(g,i2*exx,eyy,e*.30,e*.30); g.fillStyle=P.cheek; g.fill(); }
      else if(p.er===2){ g.beginPath(); g.moveTo(i2*exx-e*.44,eyy+e*.34); g.quadraticCurveTo(i2*(exx+e*.10),eyy-e*1.05,i2*exx+e*.46,eyy+e*.26); g.closePath(); fs(P.body);
        g.beginPath(); g.moveTo(i2*exx-e*.20,eyy+e*.22); g.quadraticCurveTo(i2*(exx+e*.06),eyy-e*.62,i2*exx+e*.22,eyy+e*.16); g.closePath(); g.fillStyle=P.cheek; g.fill(); }
      else if(p.er===3){ ell(g,i2*exx*.72,eyy-e*1.10,e*.30,e*1.25,i2*.14); fs(P.body); ell(g,i2*exx*.72,eyy-e*1.10,e*.15,e*.95,i2*.14); g.fillStyle=P.cheek; g.fill(); }
      else if(p.er===4){ g.beginPath(); g.moveTo(i2*exx-e*.50,eyy+e*.25); g.lineTo(i2*(exx+e*.10),eyy-e*.95); g.lineTo(i2*exx+e*.48,eyy+e*.15); g.closePath(); fs(P.body); }
      else if(p.er===5){ ell(g,i2*(exx+e*.14),eyy+e*.50,e*.40,e*.66,i2*.6); fs(P.body); }
    }
  }
  if(p.er===3) ears();
  if(p.mn){ ell(g,-hrx*.30,headCY-hry*.58,hrx*.50,hry*.82,-.35); fs(P.accent); ell(g,-hrx*.06,headCY-hry*.88,hrx*.48,hry*.30,-.22); fs(P.accent); }

  /* tête */
  ell(g,0,headCY,hrx,hry); fs(vgrad(headCY-hry,headCY+hry,P.bodyTop,P.body));
  if(p.er!==3) ears();

  /* museau, groin, bec */
  if(p.mt===1){ ell(g,0,headCY+hry*.46,p.hr*p.mz*.60,p.hr*p.mz*.44); fs(P.belly); }
  if(p.mt===2){ ell(g,0,headCY+hry*.50,p.hr*p.mz*.58,p.hr*p.mz*.38); fs(P.belly); }
  if(p.mt===3){ var by=headCY+hry*.26,b=p.hr*p.mz;
    g.beginPath(); g.moveTo(-b*.40,by-b*.26); g.lineTo(b*.40,by-b*.26); g.lineTo(0,by+b*.85); g.closePath(); fs(P.accentBot); }

  /* corne */
  if(p.hn){ var hy=headCY-hry*.88, hh=p.hr*1.55;
    g.beginPath(); g.moveTo(-p.hr*.30,hy+p.hr*.18); g.quadraticCurveTo(-p.hr*.05,hy-hh*.5,0,hy-hh); g.quadraticCurveTo(p.hr*.07,hy-hh*.5,p.hr*.30,hy+p.hr*.18); g.closePath();
    fs(vgrad(hy-hh,hy,'#fff7cf',P.accentBot));
    g.strokeStyle=P.line; g.lineWidth=thick*.6;
    for(var sk=1;sk<4;sk++){ var u=sk/4;
      g.beginPath(); g.moveTo(-p.hr*.30*(1-u),hy+p.hr*.18-hh*u+p.hr*.05); g.lineTo(p.hr*.30*(1-u),hy+p.hr*.18-hh*u-p.hr*.02); g.stroke(); } }

  /* yeux, joues, nez, bouche */
  var er2=p.hr*.155*L.eye, eo=Math.max(hrx*.40, er2*1.18), ey=headCY-hry*.02, k2;
  if(p.eyeSt===1){ ey=headCY-hry*.66; }
  if(p.eyeSt===2){ er2*=1.05; }
  er2=Math.min(er2, hrx*.40);

  if(p.blush && L.cheek>0){
    g.fillStyle=P.cheek;
    ell(g,-eo-er2*.55, ey+er2*.95, er2*.62, er2*.40); g.fill();
    ell(g, eo+er2*.55, ey+er2*.95, er2*.62, er2*.40); g.fill();
  }
  for(k2=-1;k2<=1;k2+=2){
    ell(g,k2*eo,ey,er2*.86,er2);                       // globe
    g.fillStyle=P.eye; g.fill();
    if(L.out==='dark'){ g.strokeStyle=P.line; g.lineWidth=thick*.7; g.stroke(); }
    g.fillStyle='rgba(255,255,255,.95)';               // gros reflet
    ell(g,k2*eo-er2*.26,ey-er2*.34,er2*.30,er2*.34); g.fill();
    g.fillStyle='rgba(255,255,255,.55)';               // petit reflet
    ell(g,k2*eo+er2*.28,ey+er2*.30,er2*.15,er2*.17); g.fill();
  }
  var my=ey+er2*1.25+p.hr*.05;
  if(p.mt!==3){
    if(L.nose){ g.fillStyle=P.line; ell(g,0,my-p.hr*.055,p.hr*.075,p.hr*.055); g.fill(); }
    g.strokeStyle=P.line; g.lineWidth=thick*.85; g.lineCap='round';
    if(p.mouth===0){ g.beginPath(); g.arc(0,my-p.hr*.02,p.hr*.16,.35,Math.PI-.35); g.stroke(); }
    else if(p.mouth===1){ g.beginPath(); g.arc(-p.hr*.08,my+p.hr*.03,p.hr*.09,0,Math.PI); g.arc(p.hr*.08,my+p.hr*.03,p.hr*.09,0,Math.PI); g.stroke(); }
    else { ell(g,0,my+p.hr*.06,p.hr*.09,p.hr*.075); g.fillStyle=P.cheek; g.fill(); g.stroke(); }
  }

  /* brillance générale */
  if(L.gloss>0){
    g.fillStyle=P.gloss+(L.gloss)+')';
    ell(g,-hrx*.34,headCY-hry*.46,hrx*.34,hry*.20,-.42); g.fill();
    g.fillStyle=P.gloss+(L.gloss*.5)+')';
    ell(g,-bw*.38,bodyCY-bh*.42,bw*.26,bh*.16,-.40); g.fill();
  }
  g.restore();
}

/* sprite + halo optionnel (contour blanc autocollant ou contour noir façon Flash) */
function renderSprite(mk, p, style, pose, S){
  var L=LOOK[style];
  var c=mk(S,S), g=c.getContext('2d');
  g.save(); g.translate(S/2,S/2); g.scale(S,S); drawCreature(g,p,style,pose); g.restore();
  if(!L.halo) return c;

  var sil=mk(S,S), sg=sil.getContext('2d');
  sg.drawImage(c,0,0);
  sg.globalCompositeOperation='source-in';
  sg.fillStyle=p.pal.halo; sg.fillRect(0,0,S,S);

  var out=mk(S,S), og=out.getContext('2d'), R=S*L.halo;
  for(var a=0;a<16;a++){ var an=a/16*6.2832; og.drawImage(sil, Math.cos(an)*R, Math.sin(an)*R); }
  og.drawImage(sil,0,0);
  og.drawImage(c,0,0);
  return out;
}


var CREA={SPECIES:SPECIES,makeCreature:makeCreature,renderSprite:renderSprite,mulberry32:mulberry32};
/* Lab 2: quatre salles, une par direction visuelle. */

var WW = 2600, WH = 1460;
var BPM = 124;

function makeWorld(C, mk, style, count, seed){
  var r = C.mulberry32(seed>>>0);
  var w = { style:style, tpl:[], inst:[], W:WW, H:WH };
  var NT = 46, S = 84;

  for(var i=0;i<NT;i++){
    var sp = 2 + Math.floor(r()*(C.SPECIES.length-2));
    var p = C.makeCreature(sp, 1000+i*17, style, Math.floor(r()*360));
    w.tpl.push({ p:p, a:C.renderSprite(mk,p,style,0,S), b:C.renderSprite(mk,p,style,1,S) });
  }
  for(var d=0; d<5; d++){
    var pd = C.makeCreature(1, 5000+d*29, style, Math.floor(r()*360));
    w.tpl.push({ p:pd, a:C.renderSprite(mk,pd,style,0,S), b:C.renderSprite(mk,pd,style,1,S) });
  }
  var pu = C.makeCreature(0, 777, style, Math.floor(r()*360));
  w.tpl.push({ p:pu, a:C.renderSprite(mk,pu,style,0,S), b:C.renderSprite(mk,pu,style,1,S) });
  var uniTpl = w.tpl.length-1;

  var rows = 15, y0 = 340, y1 = WH-90, slots = [];
  for(var ry=0; ry<rows; ry++){
    var f = ry/(rows-1);
    var y = y0 + (y1-y0)*Math.pow(f,1.15);
    var sc = 0.44 + 0.70*f;
    var per = Math.max(4, Math.round(count/rows * (0.7+0.6*f)));
    for(var k=0;k<per;k++){
      slots.push({ x: 60 + (WW-120)*((k + (ry%2)*0.5 + r()*0.75)/per), y: y + (r()*22-11), s: sc*(0.92+r()*0.16), row:ry });
    }
  }
  var pick = slots.filter(function(s){ return s.row>4 && s.row<rows-3; });
  var uSlot = pick[Math.floor(r()*pick.length)];

  slots.forEach(function(s){
    w.inst.push({ x:s.x, y:s.y, s:s.s, t:(s===uSlot)?uniTpl:Math.floor(r()*(w.tpl.length-1)),
      off:Math.floor(r()*4)/4 + (r()<.25?.5:0), flip:r()<.5?-1:1, uni:(s===uSlot), tw:(r()*2-1)*.09 });
  });
  w.inst.sort(function(a,b){ return a.y-b.y; });
  w.uniIdx = w.inst.findIndex(function(o){ return o.uni; });
  w.S = S;
  return w;
}

function hsl2(h,s,l,a){ h=((h%360)+360)%360; return a==null?'hsl('+h+','+s+'%,'+l+'%)':'hsla('+h+','+s+'%,'+l+'%,'+a+')'; }
function hash(n){ n=(n*2654435761)>>>0; return n; }

function cloud(g,x,y,r0,col){
  g.fillStyle=col; g.beginPath();
  g.arc(x-r0*.8,y,r0*.62,0,6.2832); g.arc(x,y-r0*.34,r0*.86,0,6.2832);
  g.arc(x+r0*.85,y,r0*.60,0,6.2832); g.rect(x-r0*.8,y-r0*.05,r0*1.65,r0*.72); g.fill();
}
function star(g,x,y,r0,col,rot){
  g.save(); g.translate(x,y); g.rotate(rot||0); g.beginPath();
  for(var i=0;i<10;i++){ var a=i/10*6.2832-1.5708, rr=i%2?r0*.44:r0; g.lineTo(Math.cos(a)*rr,Math.sin(a)*rr); }
  g.closePath(); g.fillStyle=col; g.fill(); g.restore();
}
function heart(g,x,y,r0,col){
  g.save(); g.translate(x,y); g.scale(r0,r0); g.beginPath();
  g.moveTo(0,.32); g.bezierCurveTo(-1.1,-.42,-.52,-1.05,0,-.44); g.bezierCurveTo(.52,-1.05,1.1,-.42,0,.32);
  g.closePath(); g.fillStyle=col; g.fill(); g.restore();
}

function drawRoom(g, style, t){
  var b = t*BPM/60, i, x, y;

  if(style==='chibi'){                                   /* boîte à bonbons */
    var gc=g.createLinearGradient(0,0,0,WH); gc.addColorStop(0,'#fff1fa'); gc.addColorStop(.55,'#ffe4f3'); gc.addColorStop(1,'#ffd2ea');
    g.fillStyle=gc; g.fillRect(0,0,WW,WH);
    for(i=0;i<70;i++){ var h1=hash(i*13); g.fillStyle='rgba(255,255,255,.34)';
      g.beginPath(); g.arc(h1%WW,(h1>>9)%1000,22+(h1>>5)%26,0,6.2832); g.fill(); }
    for(i=0;i<7;i++) cloud(g, (i*430+120+Math.sin(t*.25+i)*40)%WW, 150+((i*97)%160), 90+((i*31)%40), 'rgba(255,255,255,.85)');
    var pu2=1+.09*Math.abs(Math.sin(Math.PI*b));         /* coeur à facettes */
    g.save(); g.translate(WW/2,190); g.scale(pu2,pu2);
    heart(g,0,0,150,'#ff8fc4'); heart(g,0,-8,120,'#ffb6d9'); heart(g,-22,-30,44,'rgba(255,255,255,.85)');
    g.restore();
    for(i=0;i<9;i++){                                     /* ballons */
      var bx=(i*307+90)%WW, by=WH-((t*46+i*260)%(WH+320))+220;
      g.strokeStyle='rgba(120,70,110,.35)'; g.lineWidth=3;
      g.beginPath(); g.moveTo(bx,by+52); g.quadraticCurveTo(bx+12,by+110,bx,by+160); g.stroke();
      heart(g,bx,by,52,hsl2(i*47+300,88,74));
      g.fillStyle='rgba(255,255,255,.6)'; g.beginPath(); g.ellipse(bx-16,by-20,11,7,-.5,0,6.2832); g.fill();
    }
    for(i=0;i<10;i++){                                    /* sol en bandes */
      g.fillStyle = i%2 ? '#f9b4d8' : '#ffcde6'; g.fillRect(0,1000+i*48,WW,48);
    }
    g.strokeStyle='#ffffff88'; g.lineWidth=8;             /* guirlande d'étoiles */
    g.beginPath(); g.moveTo(-20,150); g.quadraticCurveTo(WW/2,330,WW+20,150); g.stroke();
    for(i=0;i<22;i++){ var u=i/21, sx=-20+(WW+40)*u, sy=150+(330-150)*2*u*(1-u);
      star(g,sx,sy+30,26,hsl2(i*36,90,74),Math.sin(b*3.14+i)*.4); }
  }

  else if(style==='pastel'){                             /* ciel doux */
    var gp=g.createLinearGradient(0,0,0,WH); gp.addColorStop(0,'#dceeff'); gp.addColorStop(.5,'#f3e8ff'); gp.addColorStop(1,'#fff4e6');
    g.fillStyle=gp; g.fillRect(0,0,WW,WH);
    for(i=0;i<7;i++){                                     /* arc-en-ciel très doux */
      g.strokeStyle=hsl2(i*44,58,84,.60); g.lineWidth=86;
      g.beginPath(); g.arc(WW/2,1180,540+i*84,Math.PI*1.03,Math.PI*1.97); g.stroke();
    }
    g.fillStyle='#f7edff'; g.beginPath(); g.arc(WW/2,1180,530,0,6.2832); g.fill();
    for(i=0;i<9;i++) cloud(g,(i*330+80+Math.sin(t*.2+i*1.3)*60)%WW, 180+((i*127)%240), 76+((i*43)%52), 'rgba(255,255,255,.92)');
    for(i=0;i<40;i++){                                    /* bulles */
      var hh=hash(i*29), bxx=(hh%WW), byy=WH-((t*38+ (hh>>7)%WH)%(WH+200));
      var rr=16+(hh>>4)%26;
      g.strokeStyle='rgba(255,255,255,.75)'; g.lineWidth=3;
      g.fillStyle=hsl2((hh>>3)%360,70,88,.24);
      g.beginPath(); g.arc(bxx,byy,rr,0,6.2832); g.fill(); g.stroke();
      g.fillStyle='rgba(255,255,255,.7)'; g.beginPath(); g.arc(bxx-rr*.34,byy-rr*.36,rr*.20,0,6.2832); g.fill();
    }
    g.fillStyle='#eadfff'; g.fillRect(0,1120,WW,WH-1120);
    g.fillStyle='#f4ecff'; for(i=0;i<WW/180;i++) g.fillRect(i*180+(i%2?0:90),1120,90,WH-1120);
  }

  else if(style==='flash'){                              /* sunburst années 2000 */
    g.fillStyle='#ffd23f'; g.fillRect(0,0,WW,WH);
    g.save(); g.translate(WW/2,620);
    for(i=0;i<28;i++){ var a0=i/28*6.2832+t*.10;
      g.fillStyle = i%2 ? '#ffdd6b' : '#ffc21f';
      g.beginPath(); g.moveTo(0,0); g.arc(0,0,2200,a0,a0+6.2832/28); g.closePath(); g.fill(); }
    g.restore();
    for(i=0;i<5;i++){                                     /* anneaux concentriques */
      var rr2=300+i*130+Math.sin(Math.PI*b)*8;
      g.strokeStyle='rgba(255,255,255,'+(.16-i*.025)+')'; g.lineWidth=26;
      g.beginPath(); g.arc(WW/2,620,rr2,0,6.2832); g.stroke();
    }
    g.fillStyle='#20162c'; g.fillRect(0,1080,WW,WH-1080);   /* scène noire brillante */
    var gf=g.createLinearGradient(0,1080,0,WH); gf.addColorStop(0,'#382a4d'); gf.addColorStop(1,'#150e22');
    g.fillStyle=gf; g.fillRect(0,1080,WW,WH-1080);
    for(i=0;i<6;i++){ var sx2=(i+.5)*WW/6+Math.sin(t*.8+i)*120;
      g.fillStyle=hsl2(i*60+t*40,95,60,.22);
      g.beginPath(); g.moveTo(sx2-70,240); g.lineTo(sx2-330,WH); g.lineTo(sx2+330,WH); g.lineTo(sx2+70,240); g.closePath(); g.fill(); }
    g.strokeStyle='#20162c'; g.lineWidth=16; g.beginPath(); g.moveTo(0,1080); g.lineTo(WW,1080); g.stroke();
    for(i=0;i<26;i++){ star(g,(i*211+60)%WW, 120+((i*173)%700), 22+(i%3)*10, 'rgba(255,255,255,.5)', i*.7); }
  }

  else {                                                 /* page de carnet, autocollants */
    g.fillStyle='#fbf4e4'; g.fillRect(0,0,WW,WH);
    g.strokeStyle='#cfe0ef'; g.lineWidth=2;
    for(i=0;i<WH/54;i++){ g.beginPath(); g.moveTo(0,i*54); g.lineTo(WW,i*54); g.stroke(); }
    for(i=0;i<WW/54;i++){ g.beginPath(); g.moveTo(i*54,0); g.lineTo(i*54,WH); g.stroke(); }
    g.strokeStyle='#f0a7b8'; g.lineWidth=4; g.beginPath(); g.moveTo(160,0); g.lineTo(160,WH); g.stroke();
    for(i=0;i<26;i++){                                    /* autocollants collés sur la page */
      var hh2=hash(i*77), sx3=120+(hh2%(WW-240)), sy3=90+((hh2>>8)%(WH-260)), rot=((hh2>>3)%100-50)/160;
      g.save(); g.translate(sx3,sy3); g.rotate(rot);
      g.shadowColor='rgba(80,60,40,.25)'; g.shadowBlur=10; g.shadowOffsetY=4;
      if(i%3===0){ star(g,0,0,48,'#fff'); star(g,0,0,40,hsl2((hh2>>5)%360,84,68)); }
      else if(i%3===1){ heart(g,0,0,52,'#fff'); heart(g,0,0,44,hsl2((hh2>>5)%360,84,70)); }
      else { g.fillStyle='#fff'; g.beginPath(); g.arc(0,0,44,0,6.2832); g.fill();
             g.fillStyle=hsl2((hh2>>5)%360,80,68); g.beginPath(); g.arc(0,0,36,0,6.2832); g.fill(); }
      g.restore();
    }
    for(i=0;i<5;i++){                                     /* rubans washi */
      var wx=(i*611+140)%WW, wy=((i*397)%WH);
      g.save(); g.translate(wx,wy); g.rotate(((i*7)%10-5)/12);
      g.fillStyle=hsl2(i*64+180,62,76,.85); g.fillRect(-130,-26,260,52);
      g.fillStyle='rgba(255,255,255,.45)'; for(var q=0;q<8;q++) g.fillRect(-130+q*34,-26,14,52);
      g.restore();
    }
    g.fillStyle='rgba(240,167,184,.18)'; g.fillRect(0,1150,WW,WH-1150);
  }
}

function drawCrowd(g, w, t, hint){
  var b = t*BPM/60, S=w.S, sticker=(w.style==='sticker');
  for(var i=0;i<w.inst.length;i++){
    var o=w.inst[i], ph=b+o.off;
    var bounce=Math.abs(Math.sin(Math.PI*ph));
    var pose=(Math.floor(ph)%2+2)%2;
    var tilt=Math.sin(Math.PI*ph)*0.07 + (sticker?o.tw:0);
    var sq=1+0.07*Math.cos(Math.PI*2*ph);
    var tp=w.tpl[o.t], img=pose?tp.b:tp.a, sc=o.s*1.55;
    g.save();
    g.translate(o.x, o.y - bounce*S*sc*0.10);
    g.rotate(tilt);
    g.scale(o.flip*sc, sc*sq);
    if(hint && o.uni){ g.shadowColor='#fff'; g.shadowBlur=44; }
    g.drawImage(img, -S/2, -S*0.86, S, S);
    g.restore();
  }
}

function drawShadows(g, w){
  var st=w.style;
  g.fillStyle = st==='flash' ? 'rgba(20,10,34,.34)' : st==='sticker' ? 'rgba(120,96,64,.20)' :
                st==='chibi' ? 'rgba(214,110,168,.22)' : 'rgba(150,130,180,.16)';
  for(var i=0;i<w.inst.length;i++){ var o=w.inst[i];
    g.beginPath(); g.ellipse(o.x, o.y+2, 36*o.s, 11*o.s, 0, 0, 6.2832); g.fill(); }
}

function drawWorld(g, w, t, hint){ drawRoom(g,w.style,t); drawShadows(g,w); drawCrowd(g,w,t,hint); }


/* Application de démo: 4 styles, zoom, clic, tempo audio. */
var cv = document.getElementById('c'), X = cv.getContext('2d');
var buf = document.createElement('canvas'), BX = buf.getContext('2d');
var mk = function(w,h){ var c=document.createElement('canvas'); c.width=w; c.height=h; return c; };

var ST = { style:'chibi', count:300, seed:12345, world:null, t0:performance.now(), hint:0, found:0, miss:0, best:null, bad:0 };
var view = { x:0, y:0, z:1, zf:1 };
var CW=0, CH=0, DPR=1;

function build(){
  ST.world = makeWorld(CREA, mk, ST.style, ST.count, ST.seed);
  ST.t0 = performance.now(); ST.found=0; ST.miss=0; ST.hint=0; ST.bad=0;
  if(AU.on) AU.origin = AU.ac.currentTime;
  fit();
}
function fit(){
  view.zf = Math.min(CW/WW, CH/WH);
  view.z = view.zf; view.x = (CW - WW*view.z)/2; view.y = (CH - WH*view.z)/2;
}
function resize(){
  DPR = Math.min(2, window.devicePixelRatio||1);
  CW = cv.clientWidth; CH = cv.clientHeight;
  cv.width = CW*DPR; cv.height = CH*DPR;
  var bw = Math.min(560, CW);
  buf.width = Math.round(bw); buf.height = Math.round(bw*CH/CW);
  if(!ST.world) build(); else fit();
}
window.addEventListener('resize', resize);

/* ---------- vue ---------- */
function clampView(){
  var zmin = view.zf*0.95, zmax = view.zf*7;
  view.z = Math.max(zmin, Math.min(zmax, view.z));
  var w = WW*view.z, h = WH*view.z;
  view.x = w<=CW ? (CW-w)/2 : Math.max(CW-w, Math.min(0, view.x));
  view.y = h<=CH ? (CH-h)/2 : Math.max(CH-h, Math.min(0, view.y));
}
function zoomAt(sx, sy, f){
  var wx = (sx-view.x)/view.z, wy = (sy-view.y)/view.z;
  view.z *= f; clampView();
  view.x = sx - wx*view.z; view.y = sy - wy*view.z; clampView();
}
cv.addEventListener('wheel', function(e){ e.preventDefault(); zoomAt(e.clientX, e.clientY, Math.exp(-e.deltaY*0.0016)); }, {passive:false});

var drag=null, pinch=null;
function pt(e){ return {x:e.clientX, y:e.clientY}; }
cv.addEventListener('pointerdown', function(e){ cv.setPointerCapture(e.pointerId); drag={sx:e.clientX, sy:e.clientY, x:view.x, y:view.y, t:performance.now(), moved:0}; });
cv.addEventListener('pointermove', function(e){
  if(!drag) return;
  var dx=e.clientX-drag.sx, dy=e.clientY-drag.sy;
  drag.moved = Math.max(drag.moved, Math.abs(dx)+Math.abs(dy));
  view.x = drag.x+dx; view.y = drag.y+dy; clampView();
});
cv.addEventListener('pointerup', function(e){
  if(drag && drag.moved<8 && performance.now()-drag.t<450) tap(e.clientX, e.clientY);
  drag=null;
});
cv.addEventListener('pointercancel', function(){ drag=null; });

/* pincement */
var touches={};
cv.addEventListener('touchstart', function(e){ if(e.touches.length===2){ drag=null; pinch=dist(e.touches); } }, {passive:true});
cv.addEventListener('touchmove', function(e){
  if(e.touches.length===2){
    e.preventDefault();
    var d=dist(e.touches), mx=(e.touches[0].clientX+e.touches[1].clientX)/2, my=(e.touches[0].clientY+e.touches[1].clientY)/2;
    if(pinch) zoomAt(mx,my,d/pinch);
    pinch=d;
  }
}, {passive:false});
cv.addEventListener('touchend', function(e){ if(e.touches.length<2) pinch=null; }, {passive:true});
function dist(t){ var dx=t[0].clientX-t[1].clientX, dy=t[0].clientY-t[1].clientY; return Math.hypot(dx,dy); }

/* ---------- clic sur une créature ---------- */
function tap(sx, sy){
  if(ST.found) { next(); return; }
  var wx=(sx-view.x)/view.z, wy=(sy-view.y)/view.z, w=ST.world, S=w.S;
  for(var i=w.inst.length-1;i>=0;i--){
    var o=w.inst[i], sz=S*o.s*1.55;
    if(Math.abs(wx-o.x) < sz*0.30 && wy > o.y-sz*0.86 && wy < o.y+sz*0.12){
      if(o.uni){ ST.found = (performance.now()-ST.t0)/1000; if(!ST.best||ST.found<ST.best) ST.best=ST.found; boom(o); }
      else { ST.miss++; ST.bad=performance.now(); blip(160,.05); }
      return;
    }
  }
}
var pops=[];
function boom(o){
  for(var i=0;i<80;i++){ var a=Math.random()*6.2832, sp=120+Math.random()*420;
    pops.push({x:o.x, y:o.y-40, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp-160, h:Math.floor(Math.random()*360), l:1}); }
  blip(880,.12); setTimeout(function(){ blip(1320,.12); },110); setTimeout(function(){ blip(1760,.16); },220);
}

/* ---------- audio: kick, charley, basse ---------- */
var AU = { on:false, ac:null, origin:0, next:0, beat:0 };
function audioToggle(){
  if(!AU.ac){ AU.ac = new (window.AudioContext||window.webkitAudioContext)(); }
  AU.ac.resume();
  AU.on = !AU.on;
  if(AU.on){ AU.origin = AU.ac.currentTime - (performance.now()-ST.t0)/1000; AU.beat = Math.ceil((AU.ac.currentTime-AU.origin)*BPM/60); }
  document.getElementById('snd').textContent = AU.on ? 'son on' : 'son off';
}
function sched(){
  if(!AU.on) return;
  var spb = 60/BPM, ahead = AU.ac.currentTime + 0.2;
  while(AU.origin + AU.beat*spb < ahead){
    var t = AU.origin + AU.beat*spb, b = AU.beat;
    kick(t);
    hat(t+spb/2, .05);
    if(b%2===0) bass(t, [55,55,73.4,61.7][(b>>1)%4]);
    if(b%8===7) hat(t+spb*0.75,.07);
    AU.beat++;
  }
}
function kick(t){
  var o=AU.ac.createOscillator(), g=AU.ac.createGain();
  o.frequency.setValueAtTime(150,t); o.frequency.exponentialRampToValueAtTime(46,t+.12);
  g.gain.setValueAtTime(.5,t); g.gain.exponentialRampToValueAtTime(.001,t+.24);
  o.connect(g); g.connect(AU.ac.destination); o.start(t); o.stop(t+.26);
}
function hat(t,v){
  var b=AU.ac.createBuffer(1,1024,AU.ac.sampleRate), d=b.getChannelData(0);
  for(var i=0;i<1024;i++) d[i]=(Math.random()*2-1)*(1-i/1024);
  var s=AU.ac.createBufferSource(), g=AU.ac.createGain(), f=AU.ac.createBiquadFilter();
  f.type='highpass'; f.frequency.value=7000; s.buffer=b;
  g.gain.setValueAtTime(v,t); g.gain.exponentialRampToValueAtTime(.001,t+.05);
  s.connect(f); f.connect(g); g.connect(AU.ac.destination); s.start(t);
}
function bass(t,f){
  var o=AU.ac.createOscillator(), g=AU.ac.createGain();
  o.type='sawtooth'; o.frequency.value=f;
  var lp=AU.ac.createBiquadFilter(); lp.type='lowpass'; lp.frequency.setValueAtTime(900,t); lp.frequency.exponentialRampToValueAtTime(180,t+.3);
  g.gain.setValueAtTime(.16,t); g.gain.exponentialRampToValueAtTime(.001,t+.42);
  o.connect(lp); lp.connect(g); g.connect(AU.ac.destination); o.start(t); o.stop(t+.44);
}
function blip(f,v){
  if(!AU.ac) return;
  var t=AU.ac.currentTime, o=AU.ac.createOscillator(), g=AU.ac.createGain();
  o.type='square'; o.frequency.value=f;
  g.gain.setValueAtTime(v,t); g.gain.exponentialRampToValueAtTime(.001,t+.14);
  o.connect(g); g.connect(AU.ac.destination); o.start(t); o.stop(t+.16);
}

/* ---------- boucle ---------- */
var last=performance.now();
function frame(now){
  var dt=Math.min(.05,(now-last)/1000); last=now;
  var t=(now-ST.t0)/1000;
  sched();

  var g = (ST.style==='pixel') ? BX : X;
  var k = (ST.style==='pixel') ? buf.width/CW : DPR;
  g.setTransform(1,0,0,1,0,0);
  g.imageSmoothingEnabled = ST.style!=='pixel';
  g.clearRect(0,0,g.canvas.width,g.canvas.height);
  var shake = (performance.now()-ST.bad<220) ? Math.sin(performance.now()*.06)*5 : 0;
  g.setTransform(view.z*k,0,0,view.z*k, view.x*k+shake, view.y*k);
  drawWorld(g, ST.world, t, ST.hint>0);

  for(var i=pops.length-1;i>=0;i--){ var p=pops[i];
    p.x+=p.vx*dt; p.y+=p.vy*dt; p.vy+=900*dt; p.l-=dt*.7;
    if(p.l<=0){ pops.splice(i,1); continue; }
    g.fillStyle='hsla('+p.h+',90%,65%,'+p.l+')'; g.fillRect(p.x-6,p.y-6,12,12);
  }
  if(ST.hint>0) ST.hint-=dt;

  if(ST.style==='pixel'){
    X.setTransform(1,0,0,1,0,0); X.imageSmoothingEnabled=false;
    X.clearRect(0,0,cv.width,cv.height);
    X.drawImage(buf,0,0,cv.width,cv.height);
  }
  hud(t);
  requestAnimationFrame(frame);
}
function hud(t){
  var el=document.getElementById('timer');
  el.textContent = (ST.found? ST.found : t).toFixed(1)+' s';
  document.getElementById('miss').textContent = ST.miss+' erreur'+(ST.miss>1?'s':'');
  var w=document.getElementById('win');
  w.style.display = ST.found ? 'flex' : 'none';
  if(ST.found) document.getElementById('wt').textContent = 'trouvée en '+ST.found.toFixed(1)+' s';
}
function next(){ ST.seed = (ST.seed*1103515245+12345)>>>0; build(); }

/* ---------- UI ---------- */
document.querySelectorAll('[data-style]').forEach(function(b){
  b.onclick=function(){
    document.querySelectorAll('[data-style]').forEach(function(x){ x.classList.remove('on'); });
    b.classList.add('on'); ST.style=b.dataset.style; build();
    document.body.dataset.style = ST.style;
  };
});
document.querySelectorAll('[data-count]').forEach(function(b){
  b.onclick=function(){
    document.querySelectorAll('[data-count]').forEach(function(x){ x.classList.remove('on'); });
    b.classList.add('on'); ST.count=+b.dataset.count; build();
  };
});
document.getElementById('snd').onclick = audioToggle;
document.getElementById('hint').onclick = function(){ ST.hint=1.2; };
document.getElementById('next').onclick = next;
document.getElementById('wn').onclick = next;

resize();
requestAnimationFrame(frame);

</script></body></html>
